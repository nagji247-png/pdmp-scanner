name: NSE Index Option OI EOD Archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nse-index-option-oi-archive.yml"
      - "nse_index_option_oi_archive.py"
      - "nse_option_buildup.py"
      - "fetch_and_score.py"
      - "dashboard.html"
      - "tests/test_nse_index_option_oi_archive.py"
      - "tests/test_nse_option_buildup.py"
  schedule:
    # Two bounded checks only: 21:00 IST (recent five-session gap fill),
    # then 22:00 IST (latest session retry). All times are UTC.
    - cron: "30 15 * * 1-5"
    - cron: "30 16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-index-option-oi-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install archive dependency
        run: python -m pip install requests
      - name: Validate archive code and tests
        run: |
          python -m py_compile nse_index_option_oi_archive.py
          python -m unittest discover -s tests -p 'test_nse_index_option_oi_archive.py' -v
          python -m unittest discover -s tests -p 'test_nse_option_buildup.py' -v
          python -m py_compile fetch_and_score.py nse_option_buildup.py
      - name: Backfill the latest five NSE trading dates (idempotent)
        id: capture
        run: |
          python - <<'PY' > "$RUNNER_TEMP/nse_oi_window.env"
          import datetime as dt
          from zoneinfo import ZoneInfo
          today = dt.datetime.now(ZoneInfo("Asia/Kolkata")).date()
          start = today - dt.timedelta(days=14)
          print(f"START_DATE={start.isoformat()}")
          print(f"END_DATE={today.isoformat()}")
          PY
          source "$RUNNER_TEMP/nse_oi_window.env"
          MAX_SESSIONS=5
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${GITHUB_EVENT_SCHEDULE}" = "30 16 * * 1-5" ]; then
            MAX_SESSIONS=1
          fi
          echo "NSE OI rolling window: $START_DATE to $END_DATE (max $MAX_SESSIONS calendar-confirmed NSE sessions)"
          if python nse_index_option_oi_archive.py \
            --from-date "$START_DATE" \
            --to-date "$END_DATE" \
            --max-sessions "$MAX_SESSIONS" \
            --delay-seconds 3; then
            echo "latest_session_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest_session_ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Latest expected NSE EOD session is not yet available; archive retry will continue."
          fi
      - name: Commit archive only
        run: |
          git config user.name "pdmp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add nse_index_option_oi.json
          if git diff --cached --quiet; then
            echo "No new validated NSE OI sessions; commit skipped."
          else
            git commit -m "backfill recent NSE index option OI sessions"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi

      - name: Fail run if latest expected NSE session is still missing
        if: always() && steps.capture.outputs.latest_session_ok != 'true'
        run: |
          echo "::error::Latest expected NSE EOD archive was not validated. The next scheduled retry will try again."
          exit 1
