name: NSE CM Cash Bhavcopy EOD Archive

on:
  push:
    branches: [main]
    paths:
      - "nse_cm_bhavcopy_archive.py"
      - "daily_stock_buying_activity.py"
      - "tests/test_daily_stock_buying_activity.py"
      - "nse_delivery_archive.py"
      - "tests/test_nse_delivery_archive.py"
      - "nse_index_option_oi_archive.py"
      - "tests/test_nse_index_option_oi_archive.py"
      - "nse_index_close_archive.py"
      - "tests/test_nse_index_close_archive.py"
      - "bse_cm_bhavcopy_archive.py"
      - "bse_sensex_close_archive.py"
      - "tests/test_bse_sensex_close_archive.py"
      - "index_constituent_rosters.py"
      - "run_three_index_cash_basket.py"
      - "stock_basket_freshness.py"
      - "tests/test_stock_basket_freshness.py"
      - "stock_basket_freshness.py"
      - "tests/test_stock_basket_freshness.py"
      - "nse_cash_basket_breadth.py"
      - "evaluate_cash_basket_forward.py"
      - "tests/test_evaluate_cash_basket_forward.py"
      - "tests/test_nse_cm_bhavcopy_archive.py"
      - "tests/test_bse_cm_bhavcopy_archive.py"
      - "tests/test_index_constituent_rosters.py"
      - "tests/test_run_three_index_cash_basket.py"
      - "tests/test_nse_cash_basket_breadth.py"
      - "tests/test_three_index_cash_basket_validation.py"
      - "exchange_calendar.json"
      - ".github/workflows/nse-cm-cash-bhavcopy-archive.yml"
  pull_request:
    paths:
      - "nse_cm_bhavcopy_archive.py"
      - "nse_index_close_archive.py"
      - "tests/test_nse_index_close_archive.py"
      - "bse_cm_bhavcopy_archive.py"
      - "tests/test_bse_sensex_close_archive.py"
      - "bse_sensex_close_archive.py"
      - "index_constituent_rosters.py"
      - "run_three_index_cash_basket.py"
      - "stock_basket_freshness.py"
      - "tests/test_stock_basket_freshness.py"
      - "nse_cash_basket_breadth.py"
      - "evaluate_cash_basket_forward.py"
      - "tests/test_evaluate_cash_basket_forward.py"
      - "tests/test_nse_cm_bhavcopy_archive.py"
      - "tests/test_bse_cm_bhavcopy_archive.py"
      - "tests/test_index_constituent_rosters.py"
      - "tests/test_run_three_index_cash_basket.py"
      - "tests/test_nse_cash_basket_breadth.py"
      - "tests/test_three_index_cash_basket_validation.py"
      - "exchange_calendar.json"
      - ".github/workflows/nse-cm-cash-bhavcopy-archive.yml"
  schedule:
    # One scheduled run after official EOD files publish (20:00 IST).
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-cm-cash-bhavcopy-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install archive dependency
        run: python -m pip install requests
      - name: Validate archive code and offline tests
        run: |
          python -m py_compile nse_cm_bhavcopy_archive.py daily_stock_buying_activity.py nse_delivery_archive.py
          python -m unittest discover -s tests -p "test_daily_stock_buying_activity.py" -v
          python -m unittest discover -s tests -p "test_nse_delivery_archive.py" -v
          python -m py_compile nse_index_option_oi_archive.py
          python -m unittest discover -s tests -p "test_nse_index_option_oi_archive.py" -v
          python -m unittest discover -s tests -p 'test_nse_cm_bhavcopy_archive.py' -v
          python -m py_compile nse_index_close_archive.py
          python -m unittest discover -s tests -p 'test_nse_index_close_archive.py' -v
          python -m py_compile bse_cm_bhavcopy_archive.py
          python -m unittest discover -s tests -p 'test_bse_cm_bhavcopy_archive.py' -v
          python -m py_compile bse_sensex_close_archive.py
          python -m unittest discover -s tests -p 'test_bse_sensex_close_archive.py' -v
          python -m py_compile index_constituent_rosters.py
          python -m unittest discover -s tests -p 'test_index_constituent_rosters.py' -v
          python -m py_compile nse_cash_basket_breadth.py
          python -m unittest discover -s tests -p 'test_nse_cash_basket_breadth.py' -v
          python -m unittest discover -s tests -p 'test_three_index_cash_basket_validation.py' -v
          python -m py_compile run_three_index_cash_basket.py stock_basket_freshness.py
          python -m unittest discover -s tests -p 'test_run_three_index_cash_basket.py' -v
          python -m unittest discover -s tests -p 'test_stock_basket_freshness.py' -v
      - name: Validate forward evaluator offline
        run: |
          python -m py_compile evaluate_cash_basket_forward.py
          python -m unittest discover -s tests -p "test_evaluate_cash_basket_forward.py" -v
      - name: Attempt one dated official NSE CM UDiFF archive
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            echo "Attempt ${attempt}/2: nse_cm_bhavcopy_archive.py --backfill-days 7"
            if python nse_cm_bhavcopy_archive.py --backfill-days 7; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "First attempt failed; retrying once after 2 minutes."
              sleep 120
            fi
          done
          echo "Both attempts failed for nse_cm_bhavcopy_archive.py --backfill-days 7"
          exit 1
      - name: Fetch one dated official BSE CM UDiFF archive
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            echo "Attempt ${attempt}/2: bse_cm_bhavcopy_archive.py --backfill-days 7"
            if python bse_cm_bhavcopy_archive.py --backfill-days 7; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "First attempt failed; retrying once after 2 minutes."
              sleep 120
            fi
          done
          echo "Both attempts failed for bse_cm_bhavcopy_archive.py --backfill-days 7"
          exit 1
      - name: Capture NSE daily index close archive with bounded backfill
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            echo "Attempt ${attempt}/2: nse_index_close_archive.py --backfill-days 14"
            if python nse_index_close_archive.py --backfill-days 14; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "First attempt failed; retrying once after 2 minutes."
              sleep 120
            fi
          done
          echo "Both attempts failed for nse_index_close_archive.py --backfill-days 14"
          exit 1
      - name: Capture official BSE SENSEX close history for CLIENT Futures validation
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          for attempt in 1 2; do
            echo "Attempt ${attempt}/2: bse_sensex_close_archive.py --from-date 2026-11-12"
            if python bse_sensex_close_archive.py --from-date 2026-11-12; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "First attempt failed; retrying once after 2 minutes."
              sleep 120
            fi
          done
          echo "Both attempts failed for bse_sensex_close_archive.py --from-date 2026-11-12"
          exit 1
      - name: Upload NSE daily index archive artifact for downstream stock research
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nse-index-close-archive
          path: nse_index_close_archive.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run offline full-universe cash basket checks
        if: github.event_name != 'pull_request'
        run: python run_three_index_cash_basket.py --backfill-days 7
      - name: Evaluate historical cash-basket signals against next captured closes
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          if [ ! -s market_signal_history.json ]; then
            echo "MARKET_SIGNAL_HISTORY_MISSING; forward evaluation withheld"
            exit 1
          fi
          python evaluate_cash_basket_forward.py --min-samples 60
          test -s cash_basket_forward_evaluation.json
      - name: Capture official NSE full bhavcopy delivery data
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          if [ -s nse_cm_bhavcopy_archive.json ]; then
            python nse_delivery_archive.py
          else
            echo "CM archive unavailable; delivery capture skipped"
          fi
      - name: Build Daily Stock Buying Activity EOD scan
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          if [ -s nse_cm_bhavcopy_archive.json ]; then
            python daily_stock_buying_activity.py --delivery-archive nse_delivery_archive.json
          else
            echo "NSE CM archive unavailable; Daily Stock Buying Activity report not regenerated"
          fi
      - name: Commit exchange cash archives and diagnostic report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -s nse_delivery_archive.json ]; then
            git add -f -- nse_delivery_archive.json
          else
            echo "NSE delivery archive unavailable; Delivery % remains blank"
          fi
          if [ -s daily_stock_buying_activity.json ]; then
            git add -f -- daily_stock_buying_activity.json
          else
            echo "Daily Stock Buying Activity report unavailable; previous verified report is retained"
          fi
          if [ -f nse_cm_bhavcopy_archive.json ]; then
            git add -f -- nse_cm_bhavcopy_archive.json
          else
            echo "NSE CM archive unavailable; daily basket diagnostic will record the gap"
          fi
          if [ -f bse_cm_bhavcopy_archive.json ]; then
            git add -f -- bse_cm_bhavcopy_archive.json
          else
            echo "BSE archive unavailable; Sensex cash basket remains withheld"
          fi
          if [ -f bse_sensex_close_archive.json ]; then
            git add -f -- bse_sensex_close_archive.json
          else
            echo "Official BSE SENSEX close archive unavailable; CLIENT Futures validation remains fail-closed"
          fi
          # The basket replay reads this generated official NSE index-close archive.
          # Stage it too, otherwise it remains a dirty tracked file and git pull
          # --rebase aborts before the diagnostic can be pushed to main.
          if [ -f nse_index_close_archive.json ]; then
            git add -f -- nse_index_close_archive.json
          else
            echo "NSE index-close archive unavailable; cash basket remains fail-closed"
          fi
          if [ ! -s index_cash_basket_diagnostics.json ]; then
            echo "CASH_BASKET_DIAGNOSTIC_REPORT_MISSING"
            exit 1
          fi
          git add -f -- index_cash_basket_diagnostics.json
          if [ -s cash_basket_forward_evaluation.json ]; then
            git add -f -- cash_basket_forward_evaluation.json
          else
            echo "Cash-basket forward evaluation unavailable; daily diagnostic is still retained"
          fi
          if git diff --cached --quiet; then
            echo "EXCHANGE_CASH_ARCHIVES_NO_CHANGE"
          else
            git commit -m "Archive exchange cash and daily index basket diagnostics"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
