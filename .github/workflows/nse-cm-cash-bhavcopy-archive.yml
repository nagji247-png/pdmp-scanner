name: NSE CM Cash Bhavcopy EOD Archive

on:
  pull_request:
    paths:
      - "nse_cm_bhavcopy_archive.py"
      - "bse_cm_bhavcopy_archive.py"
      - "index_constituent_rosters.py"
      - "run_three_index_cash_basket.py"
      - "nse_cash_basket_breadth.py"
      - "evaluate_cash_basket_forward.py"
      - "tests/test_evaluate_cash_basket_forward.py"
      - "tests/test_nse_cm_bhavcopy_archive.py"
      - "tests/test_bse_cm_bhavcopy_archive.py"
      - "tests/test_index_constituent_rosters.py"
      - "tests/test_run_three_index_cash_basket.py"
      - "tests/test_nse_cash_basket_breadth.py"
      - "tests/test_three_index_cash_basket_validation.py"
      - "exchange_calendar.json"
      - ".github/workflows/nse-cm-cash-bhavcopy-archive.yml"
  schedule:
    # One request per exchange after cash-market EOD publication; no retries.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-cm-cash-bhavcopy-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install archive dependency
        run: python -m pip install requests
      - name: Validate archive code and offline tests
        run: |
          python -m py_compile nse_cm_bhavcopy_archive.py
          python -m unittest discover -s tests -p 'test_nse_cm_bhavcopy_archive.py' -v
          python -m py_compile bse_cm_bhavcopy_archive.py
          python -m unittest discover -s tests -p 'test_bse_cm_bhavcopy_archive.py' -v
          python -m py_compile index_constituent_rosters.py
          python -m unittest discover -s tests -p 'test_index_constituent_rosters.py' -v
          python -m py_compile nse_cash_basket_breadth.py
          python -m unittest discover -s tests -p 'test_nse_cash_basket_breadth.py' -v
          python -m unittest discover -s tests -p 'test_three_index_cash_basket_validation.py' -v
          python -m py_compile run_three_index_cash_basket.py
          python -m unittest discover -s tests -p 'test_run_three_index_cash_basket.py' -v
      - name: Validate forward evaluator offline
        run: |
          python -m py_compile evaluate_cash_basket_forward.py
          python -m unittest discover -s tests -p "test_evaluate_cash_basket_forward.py" -v
      - name: Fetch one dated official NSE CM UDiFF archive
        if: github.event_name != 'pull_request'
        run: python nse_cm_bhavcopy_archive.py
      - name: Fetch one dated official BSE CM UDiFF archive
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python bse_cm_bhavcopy_archive.py
      - name: Run offline full-universe cash basket checks
        if: github.event_name != 'pull_request'
        run: python run_three_index_cash_basket.py
      - name: Evaluate historical cash-basket signals against next captured closes
        if: github.event_name != "pull_request"
        run: |
          if [ ! -s market_signal_history.json ]; then
            echo "MARKET_SIGNAL_HISTORY_MISSING; forward evaluation withheld"
            exit 1
          fi
          python evaluate_cash_basket_forward.py --min-samples 20
          test -s cash_basket_forward_evaluation.json
      - name: Commit exchange cash archives and diagnostic report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f nse_cm_bhavcopy_archive.json ]; then
            echo "NSE_CM_ARCHIVE_FILE_NOT_CREATED"
            exit 1
          fi
          git add -f -- nse_cm_bhavcopy_archive.json
          if [ -f bse_cm_bhavcopy_archive.json ]; then
            git add -f -- bse_cm_bhavcopy_archive.json
          else
            echo "BSE archive unavailable; Sensex cash basket remains withheld"
          fi
          if [ ! -s index_cash_basket_diagnostics.json ]; then
            echo "CASH_BASKET_DIAGNOSTIC_REPORT_MISSING"
            exit 1
          fi
          git add -f -- index_cash_basket_diagnostics.json
          if [ -s cash_basket_forward_evaluation.json ]; then
            git add -f -- cash_basket_forward_evaluation.json
          else
            echo "CASH_BASKET_FORWARD_EVALUATION_MISSING"
            exit 1
          fi
          if git diff --cached --quiet -- nse_cm_bhavcopy_archive.json bse_cm_bhavcopy_archive.json index_cash_basket_diagnostics.json cash_basket_forward_evaluation.json; then
            echo "EXCHANGE_CASH_ARCHIVES_NO_CHANGE"
          else
            git commit -m "Archive exchange cash and daily index basket diagnostics"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
