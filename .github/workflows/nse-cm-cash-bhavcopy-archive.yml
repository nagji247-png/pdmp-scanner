name: NSE CM Cash Bhavcopy EOD Archive

on:
  schedule:
    # One official NSE CM UDiFF ZIP request after cash-market EOD publication.
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-cm-cash-bhavcopy-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install archive dependency
        run: python -m pip install requests
      - name: Validate archive code and offline tests
        run: |
          python -m py_compile nse_cm_bhavcopy_archive.py
          python -m unittest discover -s tests -p 'test_nse_cm_bhavcopy_archive.py' -v
      - name: Fetch one dated official NSE CM UDiFF archive
        run: python nse_cm_bhavcopy_archive.py
      - name: Commit archive only when a new session is captured
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f nse_cm_bhavcopy_archive.json ]; then
            echo "NSE_CM_ARCHIVE_FILE_NOT_CREATED"
            exit 1
          fi
          git add -f -- nse_cm_bhavcopy_archive.json
          if git diff --cached --quiet -- nse_cm_bhavcopy_archive.json; then
            echo "NSE_CM_ARCHIVE_NO_CHANGE"
          else
            git commit -m "Archive official NSE CM cash Bhavcopy"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
