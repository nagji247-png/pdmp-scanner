name: Full NSE CM EQ EOD Snapshot Validation

on:
  push:
    branches:
      - feature/full-cash-eq-eod-universe-20261120
  pull_request:
    paths:
      - "fetch_and_score.py"
      - "tests/test_market_activity_bulk_quotes.py"
      - ".github/workflows/full-cash-eq-eod-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install yfinance feedparser requests pytrends curl_cffi
      - name: Compile production scanner
        run: python -m py_compile fetch_and_score.py
      - name: Test NSE quote and full CM EQ EOD parsing
        run: python -m unittest discover -s tests -p "test_market_activity_bulk_quotes.py" -v
      - name: Verify dashboard NO TRADE guard remains unchanged
        run: python -m unittest discover -s tests -p "test_dashboard_stale_guard.py" -v
