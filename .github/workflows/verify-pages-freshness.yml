name: Verify Published Pages Data Freshness

on:
  # Run only after a successful PDMP Scan; this workflow never starts or changes a scan.
  workflow_run:
    workflows: ["PDMP Scan"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pdmp-pages-freshness
  cancel-in-progress: false

jobs:
  verify-published-data:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Wait for GitHub Pages to publish the latest data.json
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PAGES_DATA_URL: https://nagji247-png.github.io/pdmp-scanner/data.json
          CACHE_BUSTER: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          pages_url = os.environ["PAGES_DATA_URL"]
          cache_buster = os.environ["CACHE_BUSTER"]

          def parse_timestamp(value):
              if not value:
                  raise ValueError("data.json is missing its top-level updated timestamp")
              stamp = dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=dt.timezone.utc)
              return stamp.astimezone(dt.timezone.utc)

          api_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/data.json?ref=main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "pdmp-pages-freshness-verifier",
              },
          )
          with urllib.request.urlopen(api_request, timeout=20) as response:
              source_file = json.loads(response.read().decode("utf-8"))
          source_data = json.loads(base64.b64decode(source_file["content"]).decode("utf-8"))
          expected = parse_timestamp(source_data.get("updated"))
          print(f"Repository data.json updated: {expected.isoformat()}")

          calendar_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/exchange_calendar.json?ref=main",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "pdmp-pages-freshness-verifier",
              },
          )
          with urllib.request.urlopen(calendar_request, timeout=20) as response:
              calendar_file = json.loads(response.read().decode("utf-8"))
          calendar = json.loads(base64.b64decode(calendar_file["content"]).decode("utf-8"))

          ist = dt.timezone(dt.timedelta(hours=5, minutes=30))
          local_scan = expected.astimezone(ist)
          expected_day = local_scan.date()

          def is_session(day):
              key = day.isoformat()
              special = calendar.get("special_sessions", {})
              if isinstance(special, dict) and key in special:
                  return True
              holidays = {
                  str(item.get("date")) for item in calendar.get("holidays", [])
                  if isinstance(item, dict) and item.get("date")
              }
              return day.weekday() < 5 and key not in holidays

          if is_session(expected_day) and local_scan.time().replace(tzinfo=None) < dt.time(20, 0):
              expected_day -= dt.timedelta(days=1)
          while not is_session(expected_day):
              expected_day -= dt.timedelta(days=1)
          expected_basket_date = expected_day.isoformat()

          def validate_basket_freshness(data, label):
              instruments = data.get("instruments", {}) if isinstance(data, dict) else {}
              problems = []
              for index_name in ("NIFTY", "SENSEX", "BANKNIFTY"):
                  item = instruments.get(index_name, {})
                  breakdown = item.get("component_breakdown", {}) if isinstance(item, dict) else {}
                  basket = breakdown.get("stock_basket_diagnostic", {}) if isinstance(breakdown, dict) else {}
                  source_date = basket.get("source_date") if isinstance(basket, dict) else None
                  if source_date != expected_basket_date:
                      problems.append(f"{index_name}={source_date or 'missing'}")
              if problems:
                  raise SystemExit(
                      f"FAIL: {label} STOCK BASKET date mismatch; expected "
                      f"{expected_basket_date}; " + ", ".join(problems)
                  )
              print(f"PASS: {label} NIFTY/SENSEX/BANKNIFTY STOCK BASKET dates={expected_basket_date}")

          validate_basket_freshness(source_data, "Repository")

          deadline = time.monotonic() + 15 * 60
          last_problem = "Pages data has not yet been checked"
          while time.monotonic() < deadline:
              url = pages_url + "?" + urllib.parse.urlencode({"verify": cache_buster})
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "pdmp-pages-freshness-verifier",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      published_data = json.loads(response.read().decode("utf-8"))
                  published = parse_timestamp(published_data.get("updated"))
                  if published >= expected:
                      validate_basket_freshness(published_data, "Published Pages")
                      print(
                          "PASS: live GitHub Pages data.json is current "
                          f"(published updated={published.isoformat()}, "
                          f"repository updated={expected.isoformat()})."
                      )
                      raise SystemExit(0)
                  last_problem = (
                      "Live Pages data is behind repository data "
                      f"(live={published.isoformat()}, expected_at_least={expected.isoformat()})"
                  )
              except SystemExit:
                  raise
              except (urllib.error.URLError, TimeoutError, ValueError, KeyError, json.JSONDecodeError) as exc:
                  last_problem = f"{type(exc).__name__}: {str(exc)[:200]}"
              print(f"Waiting for Pages publication: {last_problem}")
              time.sleep(30)

          raise SystemExit(
              "FAIL: Pages data.json did not catch up within 15 minutes. " + last_problem
          )
          PY
