name: TRINETRA PR Preview Bundle

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "dashboard.html"
      - "fetch_and_score.py"
      - "archive_component_diagnostics.py"
      - "nse_option_buildup.py"
      - "trinetra_test_components.py"
      - "nse_index_option_oi.json"
      - "tests/test_trinetra_dashboard_rendering.js"
      - ".github/workflows/trinetra-pr-preview.yml"

permissions:
  contents: read

jobs:
  preview-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Build offline archive diagnostics (no market-provider requests)
        run: python archive_component_diagnostics.py

      - name: Assemble isolated browser preview
        run: |
          mkdir -p trinetra-preview
          cp dashboard.html trinetra-preview/dashboard.html
          cp archive-component-diagnostics.json trinetra-preview/archive-component-diagnostics.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("archive-component-diagnostics.json").read_text(encoding="utf-8"))
          assets = (report.get("nse_option_buildup_test") or {}).get("assets") or {}
          instruments = {}
          for symbol in ("NIFTY", "BANKNIFTY"):
              item = assets.get(symbol) or {}
              score = item.get("test_score")
              available = (
                  item.get("test_score_status") == "ARCHIVE_PAIR_TEST_ONLY_NOT_LIVE"
                  and isinstance(score, (int, float))
                  and -10 <= score <= 10
              )
              component = {
                  "status": "available" if available else "unavailable",
                  "score": score if available else None,
                  "test_only": True,
                  "source": item.get("source") or "NSE official F&O archive",
                  "source_date": item.get("source_date"),
                  "matched": item.get("classified_contracts", 0),
              }
              breakdown = {
                  "stock_basket_diagnostic": None,
                  "experimental_combined_final": {
                      "status": "available" if available else "unavailable",
                      "score": score if available else None,
                      "included_components": ["option_buildup"] if available else [],
                      "normalized_weights_pct": {"option_buildup": 100} if available else {},
                  },
                  "experimental_combined_components": {
                      "option_buildup": component
                  } if available else {},
              }
              instruments[symbol] = {
                  "score": 0,
                  "price": None,
                  "change_pct": None,
                  "headlines": [],
                  "component_breakdown": breakdown,
              }

          payload = {
              "preview_mode": "TEST_ONLY_ARCHIVE_DIAGNOSTIC",
              "updated": report.get("generated_at"),
              "instruments": instruments,
              "preview_notice": "यह isolated browser preview है। Archive pair TEST data है, live quote या trade signal नहीं।",
          }
          Path("trinetra-preview/data.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          Path("trinetra-preview/README-HI.txt").write_text(
              "TRINETRA PR #521 — अलग TEST Preview\\n"
              "1. इस ZIP को extract करें।\\n"
              "2. dashboard.html को सीधे Chrome में खोलने पर browser file:// सुरक्षा के कारण data.json fetch रुक सकता है।\\n"
              "3. इसलिए यह bundle source/data inspection और artifact verification के लिए है; इसे live dashboard न मानें।\\n"
              "4. data.json में केवल archive-derived NIFTY/BANKNIFTY TEST diagnostic है। SENSEX में NSE index-option data नहीं जोड़ा गया।\\n"
              "5. कोई Auto Run, Google Trends, NSE या Yahoo Finance request इस workflow में नहीं चलती।\\n"
              "Production dashboard और PDMP Final Score इस preview से नहीं बदलते.\\n",
              encoding="utf-8"
          )
          PY
          node tests/test_trinetra_dashboard_rendering.js

      - name: Upload isolated preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: trinetra-pr-521-preview
          path: trinetra-preview/
          if-no-files-found: error
          retention-days: 7
