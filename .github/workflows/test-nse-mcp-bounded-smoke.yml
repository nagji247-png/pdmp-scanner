name: NSE MCP Bounded Read-only Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-mcp-bounded-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated HTTP client
        run: python -m pip install --disable-pip-version-check curl_cffi

      - name: Run bounded read-only checks (manual only)
        run: |
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          from curl_cffi import requests

          URL = "https://mcp.nseindia.in/cmmkt/mcp"
          session = requests.Session(impersonate="chrome124")
          headers = {"Content-Type": "application/json", "Accept": "application/json, text/event-stream"}

          def decode(resp):
              if "text/event-stream" in resp.headers.get("content-type", "").lower():
                  for block in reversed(resp.text.replace("\\r\\n", "\\n").split("\\n\\n")):
                      data = "\\n".join(line[5:].lstrip() for line in block.splitlines() if line.startswith("data:"))
                      if data.strip():
                          return json.loads(data)
                  raise RuntimeError("No JSON-RPC event in SSE response")
              return resp.json()

          def post(payload, extra_headers=None):
              h = dict(headers)
              if extra_headers:
                  h.update(extra_headers)
              r = session.post(URL, headers=h, json=payload, timeout=35)
              r.raise_for_status()
              out = decode(r)
              if out.get("error"):
                  raise RuntimeError(str(out["error"]))
              return out, r

          init, init_resp = post({
              "jsonrpc":"2.0","id":1,"method":"initialize",
              "params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"trinetra-bounded-smoke","version":"1.0"}}
          })
          sid = init_resp.headers.get("mcp-session-id") or init_resp.headers.get("Mcp-Session-Id")
          h = {"Mcp-Session-Id":sid} if sid else {}
          results = []
          calls = [
              ("cm_get_data_status", {}),
              ("cm_get_allstocks_status", {}),
              ("cm_get_sme_stocks", {"limit":500,"symbolFilter":""}),
              ("cm_get_call_auction_stocks", {"limit":500,"symbolFilter":""}),
              ("cm_get_bond_stocks", {"limit":500,"symbolFilter":""}),
              ("nse_get_market_movers", {"indexName":"","limit":10}),
              ("cm_get_live_indices", {"group":"sectoral","nameFilter":""}),
          ]
          for i,(name,args) in enumerate(calls, start=2):
              started = time.time()
              try:
                  out,_ = post({"jsonrpc":"2.0","id":i,"method":"tools/call","params":{"name":name,"arguments":args}},h)
                  result = (out.get("result") or {})
                  structured = result.get("structuredContent")
                  content = result.get("content") or []
                  text_blob = " ".join(x.get("text","") for x in content if isinstance(x,dict))
                  results.append({
                      "tool":name,"ok":not result.get("isError",False),
                      "elapsed_seconds":round(time.time()-started,2),
                      "structured_keys":list(structured.keys())[:20] if isinstance(structured,dict) else [],
                      "content_text_preview":text_blob[:1800],
                      "is_error":result.get("isError",False)
                  })
                  print(f"TOOL_RESULT {name}: ok={not result.get('isError',False)} elapsed={round(time.time()-started,2)}")
              except Exception as e:
                  results.append({"tool":name,"ok":False,"elapsed_seconds":round(time.time()-started,2),"error":str(e)[:1000]})
                  print(f"TOOL_ERROR {name}: {str(e)[:500]}")
              if i < 8:
                  time.sleep(1.5)

          report = {
              "captured_at_utc":datetime.now(timezone.utc).isoformat(),
              "endpoint":URL,
              "market_hours_status":"Run is manually triggered; interpret nseTimestamp and cache timestamps. Outside 09:15-15:30 IST, quotes are last published values, not live intraday.",
              "market_data_calls_made":len(calls),
              "polling_or_schedule_added":False,
              "results":results
          }
          with open("nse_mcp_smoke_report.json","w",encoding="utf-8") as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          passed=sum(1 for x in results if x.get("ok"))
          print(f"SUMMARY: {passed}/{len(results)} tool calls returned without transport/tool error")
          PY

      - name: Upload bounded smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-mcp-bounded-smoke-report
          path: nse_mcp_smoke_report.json
          retention-days: 14
