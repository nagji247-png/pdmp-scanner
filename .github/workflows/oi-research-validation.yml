name: OI Research Validation

on:
  pull_request:
    paths:
      - "backtest_participant_oi.py"
      - "fetch_and_score.py"
      - "tests/**"
      - ".github/workflows/oi-research-validation.yml"
  push:
    branches: [main]
    paths:
      - "backtest_participant_oi.py"
      - "fetch_and_score.py"
      - "tests/**"
      - ".github/workflows/oi-research-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install pandas yfinance
      - name: Validate Python syntax
        run: python -m py_compile fetch_and_score.py backtest_participant_oi.py tests/test_participant_oi_backtest.py
      - name: Run OI research unit tests
        run: python -m unittest discover -s tests -v
