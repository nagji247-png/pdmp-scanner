name: OI Research Validation

on:
  schedule:
    # Read-only archive audit after the daily EOD scan/backtest (21:15 IST).
    - cron: "45 15 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backtest_participant_oi.py"
      - "summarize_participant_oi_backtest.py"
      - "fetch_and_score.py"
      - "validate_market_signal_history.py"
      - "market_signal_archive_backtest.py"
      - "offline_contrarian_market_backtest.py"
      - "tests/**"
      - ".github/workflows/oi-research-validation.yml"
  push:
    branches: [main]
    paths:
      - "backtest_participant_oi.py"
      - "summarize_participant_oi_backtest.py"
      - "fetch_and_score.py"
      - "validate_market_signal_history.py"
      - "market_signal_archive_backtest.py"
      - "offline_contrarian_market_backtest.py"
      - "tests/**"
      - ".github/workflows/oi-research-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install pandas yfinance feedparser requests
      - name: Validate Python syntax
        run: python -m py_compile fetch_and_score.py backtest_participant_oi.py summarize_participant_oi_backtest.py validate_market_signal_history.py tests/test_participant_oi_backtest.py tests/test_participant_oi_summary.py tests/test_market_signal_history.py market_signal_archive_backtest.py offline_contrarian_market_backtest.py
      - name: Run OI research unit tests
        run: python -m unittest discover -s tests -v
      # The participant archive is committed and the price fetch is limited to three
      # daily index histories. This is read-only research; it never changes data.json.
      - name: Run CLIENT option quantity directional backtest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: |
          python backtest_participant_oi.py
          python summarize_participant_oi_backtest.py
      - name: Add CLIENT option quantity results to workflow report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("participant_oi_backtest_summary.json").read_text())
          print("## CLIENT option OI quantity backtest (research only)")
          print(f"- Status: **{report.get('status')}**")
          print(f"- OI sessions: **{report.get('oi_sessions')}** ({report.get('oi_first_date')} to {report.get('oi_last_date')})")
          print(f"- Production score changed: **No**")
          if report.get("status") != "exploratory_only":
              print(f"- Reason: {report.get('reason', 'research report unavailable')}")
          for asset, item in (report.get("indices") or {}).items():
              features = item.get("features") or []
              rows = [x for x in features if x.get("feature") == "CLIENT.index_option_directional_net_quantity"]
              print(f"\n### {asset}")
              print("| Horizon | Holdout samples | Hit rate | False signals | Train hit rate |")
              print("|---:|---:|---:|---:|---:|")
              for row in rows:
                  holdout = row.get("holdout") or {}
                  train = row.get("train") or {}
                  print(f"| {row.get('horizon_sessions')} | {holdout.get('directional_observation_count')} | {holdout.get('directional_hit_rate_pct')}% | {holdout.get('contrarian_hit_rate_pct')}% | {holdout.get('false_signals')} |")
          print("\nThis tests index direction from next-session open to the 1/3/5-session close; it does not test option premium profitability.")
          print("NSE CLIENT options OI is market-wide aggregate positioning, not separate index-level CLIENT positioning.")
          PY
      - name: Upload CLIENT option quantity research artifacts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: client-option-quantity-backtest-${{ github.run_number }}
          path: |
            participant_oi_backtest.json
            participant_oi_backtest_summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Test per-asset component archive backtest
        run: python -m unittest discover -s tests -p "test_market_signal_archive_backtest.py" -v
      - name: Audit point-in-time combined-signal archive
        run: python validate_market_signal_history.py --min-sessions 120 --target-sessions 250
      # This replay reads only the committed EOD archive. It makes zero market-data requests
      # and never modifies data.json or any production score.
      - name: Build per-asset contrarian component backtest report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python market_signal_archive_backtest.py --archive market_signal_history.json --threshold 1 --out contrarian_component_backtest_report.json
      - name: Add component backtest summary to workflow report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("contrarian_component_backtest_report.json").read_text())
          summary = report["summary"]
          print("## Per-asset verified component contrarian backtest")
          print(f"- Total eligible next-session samples: **{summary['sample_count']}**")
          print(f"- Contrarian accuracy: **{summary['contrarian_accuracy_pct']}**")
          print(f"- Crowd-follow accuracy: **{summary['crowd_follow_accuracy_pct']}**")
          print(f"- Provider calls: **{report['provider_calls']}**")
          print("- Production scores modified: **No**")
          print("\n| Asset | Samples | Contrarian accuracy | Crowd-follow accuracy |")
          print("|---|---:|---:|---:|")
          for asset in ("NIFTY", "SENSEX", "BANKNIFTY", "GOLD", "SILVER"):
              row = report["by_asset"].get(asset, {})
              print(f"| {asset} | {row.get('sample_count', 0)} | {row.get('contrarian_accuracy_pct')} | {row.get('crowd_follow_accuracy_pct')} |")
          print("\nZero samples means insufficient dated component evidence, not zero accuracy.")
          print("This is close-to-close direction testing, not option-premium profitability.")
          print("\n### Latest per-asset component evidence (committed EOD archive)")
          print("| Asset | Latest EOD date | Final score | Coverage | Included components |")
          print("|---|---|---:|---:|---|")
          for asset in ("NIFTY", "SENSEX", "BANKNIFTY", "GOLD", "SILVER"):
              row = report["archive_audit"].get("latest_asset_evidence", {}).get(asset, {})
              coverage = row.get("coverage") or {}
              score = row.get("final_score")
              score_text = f"{score:+.2f}" if isinstance(score, (int, float)) else "—"
              coverage_text = (
                  f"{coverage.get('coverage_pct')}% "
                  f"({coverage.get('included_count')}/{coverage.get('applicable_count')})"
                  if coverage else "—"
              )
              included = ", ".join(row.get("included_components") or []) or "—"
              print(f"| {asset} | {row.get('date', '—')} | {score_text} | {coverage_text} | {included} |")
          print("\n### Archive audit")
          print("```json")
          print(json.dumps(report["archive_audit"], indent=2))
          print("```")
          PY
      - name: Upload component backtest report
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: trinetra-component-backtest-${{ github.run_number }}
          path: contrarian_component_backtest_report.json
          if-no-files-found: error
          retention-days: 30
