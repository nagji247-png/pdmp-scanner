name: Refresh NSE stock company research cache
on:
  push:
    branches: [main]
    paths:
      - 'stock_company_research.py'
      - 'stock_return_history.py'
      - 'nse_index_close_archive.json'
      - 'tests/test_stock_return_history.py'
      - 'nse-fo-stock-sector-master.json'
      - '.github/workflows/stock-company-research.yml'
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum stocks to refresh (1-25)"
        required: false
        default: "10"
  schedule:
    # Daily at 20:15 IST, after the cash market closes.
    - cron: "45 14 * * 1-5"
permissions:
  contents: write
concurrency:
  group: stock-company-research-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public-data client
        run: pip install requests
      - name: Refresh a small NSE batch
        env:
          STOCK_RESEARCH_BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
        run: python stock_company_research.py
      - name: Refresh one-year NSE stock, sector and market returns
        run: python stock_return_history.py
      - name: Commit only company research cache to the triggering branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- stock-company-data.json)" ]; then
            echo "No company research cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-company-data.json
          git commit -m "Refresh incremental NSE stock company research cache"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
