name: Refresh NSE stock company research cache
on:
  push:
    branches: [main]
    paths:
      - 'stock_company_research.py'
      - 'stock_return_history.py'
      - 'tests/test_stock_return_history.py'
      - 'nse-fo-stock-sector-master.json'
      - '.github/workflows/stock-company-research.yml'
  workflow_run:
    workflows: ["NSE CM Cash Bhavcopy EOD Archive"]
    types: [completed]
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum stocks to refresh (1-25)"
        required: false
        default: "10"
permissions:
  actions: read
  contents: write
concurrency:
  group: stock-company-research-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Download NSE index archive from completed EOD workflow
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nse-index-close-archive
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public-data client
        run: pip install requests
      - name: Refresh a small NSE batch
        env:
          STOCK_RESEARCH_BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
        run: python stock_company_research.py
      - name: Refresh one-year stock, sector and market returns from NSE archives
        run: python stock_return_history.py
      - name: Commit only company research cache to the triggering branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- stock-company-data.json)" ]; then
            echo "No company research cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-company-data.json
          git commit -m "Refresh incremental NSE stock company research cache"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
