name: PDMP Scan

on:
  # कोड/स्कैन वर्कफ़्लो बदलने पर तुरंत एक सत्यापन स्कैन चलाएँ।
  # data.json के ऑटो-कमिट इस फ़िल्टर से ट्रिगर नहीं होंगे।
  pull_request:
    paths:
      - "fetch_and_score.py"
      - "nifty_chart_data.py"
      - "tests/test_market_activity_bulk_quotes.py"
      - "stock_basket_freshness.py"
      - "tests/test_stock_basket_loader_freshness.py"
      - "stock_basket_freshness.py"
      - "tests/test_stock_basket_loader_freshness.py"
      - "crowd_trap_detector.py"
      - "tests/test_crowd_trap_detector.py"
      - "provisional_component_scoring.py"
      - "dashboard.html"
      - "signal_performance.py"
      - "signal-performance.js"
      - "tests/test_signal_performance.py"
      - "tests/test_client_ce_pe_provisional_score.py"
      - "tests/test_provisional_component_scoring.py"
      - "tests/test_component_breakdown_integration.py"
      - ".github/workflows/scan-watchdog.yml"
      - "backtest_participant_oi.py"
      - "client_futures_promotion.py"
      - "tests/test_client_futures_promotion.py"
      - "tests/test_client_futures_forward_validation.py"
      - ".github/workflows/scan.yml"
  push:
    branches: [main]
    paths:
      - "fetch_and_score.py"
      - "nifty_chart_data.py"
      - "tests/test_market_activity_bulk_quotes.py"
      - "stock_basket_freshness.py"
      - "tests/test_stock_basket_loader_freshness.py"
      - "crowd_trap_detector.py"
      - "tests/test_crowd_trap_detector.py"
      - "backtest_participant_oi.py"
      - "summarize_participant_oi_backtest.py"
      - "nse_index_option_oi.json"
      - "index_cash_basket_diagnostics.json"
      - "client_futures_promotion.py"
      - ".github/workflows/scan.yml"
      - ".github/workflows/scan-watchdog.yml"
  schedule:
    # सामान्य PDMP स्कैन हर 30 मिनट; Trends केवल अलग तय चार स्लॉट पर।
    - cron: "7,37 * * * *"
    # अतिरिक्त dashboard refresh slots (IST): 10:00, 12:00, 14:00, 15:15.
    # ये स्लॉट data.json / Market Activity refresh करते हैं; Google Trends नहीं चलाते।
    - cron: "30 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "45 9 * * 1-5"
    # Google Trends के मौजूदा चार स्लॉट (IST): 09:15, 11:00, 13:00, 19:00।
  # Google Trends requests run only in the four scheduled slots.
    - cron: "45 3 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
    # Daily participant OI research/backtest after EOD archive refresh (20:45 IST).
    - cron: "15 15 * * *"
  workflow_dispatch:
  # Watchdog only dispatches when published scan data is older than 45 minutes.
  # This event does not run Google Trends; it is a normal recovery scan.
  repository_dispatch:
    types: [scan-watchdog]
  # GITHUB_TOKEN archive commits do not trigger other workflows. Run a normal
  # no-Trends PDMP refresh after official cash-basket or index-option EOD archives complete.
  workflow_run:
    workflows:
      - "NSE CM Cash Bhavcopy EOD Archive"
      - "NSE Index Option OI EOD Archive"
    types: [completed]
    branches: [main]

permissions:
  contents: write

# एक समय में एक ही रन चले, ताकि दो रन एक साथ push न करें
concurrency:
  group: pdmp-scan
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run events carry the archive run SHA, which may predate the latest scan data commit.
          # Use latest main for production scans; PR checks must use the PR head under test.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install yfinance feedparser requests pytrends
      - name: Validate Python syntax and market-data tests
        run: |
          python -m py_compile nifty_chart_data.py fetch_and_score.py provisional_component_scoring.py client_futures_promotion.py crowd_mood_intraday.py crowd_trap_detector.py backtest_participant_oi.py summarize_participant_oi_backtest.py stock_basket_freshness.py signal_performance.py
          python -m unittest discover -s tests -p 'test_signal_performance.py' -v
          node --check signal-performance.js
          python -m unittest discover -s tests -p 'test_stock_basket_loader_freshness.py' -v
          python -m unittest discover -s tests -p 'test_market_activity_bulk_quotes.py' -v
          python -m unittest discover -s tests -p 'test_news_fetch_cache.py' -v
          python -m unittest discover -s tests -p 'test_crowd_trap_detector.py' -v
          python -m unittest discover -s tests -p 'test_client_ce_pe_provisional_score.py' -v
          python -m unittest discover -s tests -p 'test_client_futures_forward_validation.py' -v
          python -m unittest discover -s tests -p 'test_client_futures_promotion.py' -v
      - name: Run PDMP scan
        env:
          # Manual dispatch और तय चार schedule स्लॉट पर Trends चलेगा।
          # सामान्य 30-मिनट schedule और code push पर Trends कॉल नहीं होंगे।
          TRENDS_SCAN: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '45 3 * * *' || github.event.schedule == '30 5 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 13 * * *')) }}
          TRENDS_SLOT: ${{ github.event.schedule == '45 3 * * *' && '0915' || github.event.schedule == '30 5 * * *' && '1100' || github.event.schedule == '30 7 * * *' && '1300' || github.event.schedule == '30 13 * * *' && '1900' || '' }}
        if: github.event_name != 'pull_request'
        run: python fetch_and_score.py
      - name: Refresh NIFTY 5-minute chart archive
        if: github.event_name != 'pull_request'
        run: python nifty_chart_data.py
      - name: Record and evaluate signal performance at next-session close only
        if: github.event_name != 'pull_request'
        run: python signal_performance.py
      - name: Run participant OI backtest diagnostics
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'workflow_run' || (github.event_name == 'schedule' && github.event.schedule == '15 15 * * *'))
        run: |
          python backtest_participant_oi.py
          python summarize_participant_oi_backtest.py
      - name: Commit results
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pdmp-bot"
          git config user.email "bot@users.noreply.github.com"
          output_files=(
            data.json history.csv participant_oi_history.json participant_oi_backtest.json
            participant_oi_backtest_summary.json market_signal_history.json crowd_mood_history.json
            contrarian.json crowd_events.json divergence_events.json signal_state.json signal_log.json
            mcx_silver.json mcx_gold.json mcx_crudeoil.json nifty_chart_data.json signal-performance.json
          )

          # The scan's generated JSON is one complete snapshot. Never rebase/merge
          # it line-by-line with another scan's data.json: that can mix counters
          # from an older run with contract details from a newer run.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --mixed "origin/$GITHUB_REF_NAME"
            for f in "${output_files[@]}"; do
              if [ -f "$f" ]; then git add "$f"; fi
            done

            if git diff --cached --quiet; then
              echo "कोई बदलाव नहीं, commit छोड़ा गया"
              exit 0
            fi

            git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; latest main पर clean snapshot commit दोबारा बनाया जाएगा।"
          done

          echo "तीन प्रयासों के बाद scan snapshot push नहीं हो सका।"
          exit 1
