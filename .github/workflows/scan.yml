name: PDMP Scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# एक समय में एक ही रन चले, ताकि दो रन एक साथ push न करें
concurrency:
  group: pdmp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install yfinance feedparser requests pytrends
      - run: python fetch_and_score.py
      - name: Commit results
        run: |
          git config user.name "pdmp-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json history.csv contrarian.json crowd_events.json divergence_events.json signal_state.json signal_log.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "कोई बदलाव नहीं, commit छोड़ा गया"
          else
            git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
