name: PDMP Scan

on:
  # कोड/स्कैन वर्कफ़्लो बदलने पर तुरंत एक सत्यापन स्कैन चलाएँ।
  # data.json के ऑटो-कमिट इस फ़िल्टर से ट्रिगर नहीं होंगे।
  push:
    branches: [main]
    paths:
      - "fetch_and_score.py"
      - ".github/workflows/scan.yml"
  schedule:
    # सामान्य PDMP स्कैन हर 30 मिनट; Trends केवल तय चार स्लॉट पर।
    - cron: "0 * * * *"
    - cron: "30 0-4,6,8-12,14-23 * * *"
    # Google Trends के चार स्लॉट (IST): 09:15, 11:00, 13:00, 19:00।
    - cron: "45 3 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

# एक समय में एक ही रन चले, ताकि दो रन एक साथ push न करें
concurrency:
  group: pdmp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install yfinance feedparser requests pytrends
      - name: Run PDMP scan
        env:
          # Manual dispatch और तय चार schedule स्लॉट पर Trends चलेगा।
          # सामान्य 30-मिनट schedule और code push पर Trends कॉल नहीं होंगे।
          TRENDS_SCAN: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '45 3 * * *' || github.event.schedule == '30 5 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 13 * * *')) }}
          TRENDS_SLOT: ${{ github.event.schedule == '45 3 * * *' && '0915' || github.event.schedule == '30 5 * * *' && '1100' || github.event.schedule == '30 7 * * *' && '1300' || github.event.schedule == '30 13 * * *' && '1900' || '' }}
        run: python fetch_and_score.py
      - name: Commit results
        run: |
          git config user.name "pdmp-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json history.csv contrarian.json crowd_events.json divergence_events.json signal_state.json signal_log.json mcx_silver.json mcx_gold.json mcx_crudeoil.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "कोई बदलाव नहीं, commit छोड़ा गया"
          else
            git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
