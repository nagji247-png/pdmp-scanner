name: PDMP Scan

on:
  schedule:
    - cron: "*/15 * * * *"   # हर 15 मिनट (Private रिपॉज़िटरी के कोटे के लिए)
  workflow_dispatch:          # मैन्युअल चलाने के लिए

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance feedparser requests pytrends
      - run: python fetch_and_score.py
      - name: Commit results
        run: |
          git config user.name "pdmp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json history.csv
          git diff --cached --quiet || git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
