name: PDMP Scan

on:
  schedule:
    # सामान्य PDMP स्कैन हर 30 मिनट (UTC); भारत में भी हर आधे घंटे।
    - cron: "0,30 * * * *"
    # Google Trends: 09:15 IST (03:45 UTC); बाकी तीन स्लॉट आधे-घंटे वाले रन में।
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# एक समय में एक ही रन चले, ताकि दो रन एक साथ push न करें
concurrency:
  group: pdmp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install yfinance feedparser requests pytrends
      - name: Run PDMP scan
        env:
          # केवल चार तय IST स्लॉट: 09:15, 11:00, 13:00 और 19:00।
          # Manual dispatch और बाकी 30-मिनट रन Google Trends को कॉल नहीं करेंगे।
          TRENDS_SCAN: ${{ github.event.schedule == '45 3 * * *' || github.event.schedule == '30 5 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 13 * * *' }}
        run: python fetch_and_score.py
      - name: Commit results
        run: |
          git config user.name "pdmp-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json history.csv contrarian.json crowd_events.json divergence_events.json signal_state.json signal_log.json mcx_silver.json mcx_gold.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "कोई बदलाव नहीं, commit छोड़ा गया"
          else
            git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
