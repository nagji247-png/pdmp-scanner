name: PDMP Scan

on:
  # कोड/स्कैन वर्कफ़्लो बदलने पर तुरंत एक सत्यापन स्कैन चलाएँ।
  # data.json के ऑटो-कमिट इस फ़िल्टर से ट्रिगर नहीं होंगे।
  pull_request:
    paths:
      - "fetch_and_score.py"
      - "provisional_component_scoring.py"
      - "dashboard.html"
      - "tests/test_upstox_market_data.py"
      - "tests/test_client_ce_pe_provisional_score.py"
      - "tests/test_provisional_component_scoring.py"
      - "tests/test_component_breakdown_integration.py"
      - "backtest_participant_oi.py"
      - "tests/test_client_futures_forward_validation.py"
      - "upstox_market_data.py"
      - ".github/workflows/scan.yml"
  push:
    branches: [main]
    paths:
      - "fetch_and_score.py"
      - "upstox_market_data.py"
      - "tests/test_upstox_market_data.py"
      - "backtest_participant_oi.py"
      - "summarize_participant_oi_backtest.py"
      - ".github/workflows/scan.yml"
  schedule:
    # सामान्य PDMP स्कैन हर 30 मिनट; Trends केवल तय चार स्लॉट पर।
    - cron: "7,37 * * * *"
    # Schedule registration refresh; Google Trends के चार स्लॉट (IST): 09:15, 11:00, 13:00, 19:00।
  # consolidated validation: trigger a real Trends-enabled scan on this push.
    - cron: "45 3 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
    # Daily participant OI research/backtest after EOD archive refresh (20:45 IST).
    - cron: "15 15 * * *"
  workflow_dispatch:
  # Watchdog only dispatches when published scan data is older than 45 minutes.
  # This event does not run Google Trends; it is a normal recovery scan.
  repository_dispatch:
    types: [scan-watchdog]

permissions:
  contents: write

# एक समय में एक ही रन चले, ताकि दो रन एक साथ push न करें
concurrency:
  group: pdmp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install yfinance feedparser requests pytrends
      - name: Validate Python syntax and Upstox fallback tests
        run: |
          python -m py_compile fetch_and_score.py provisional_component_scoring.py upstox_market_data.py crowd_mood_intraday.py backtest_participant_oi.py summarize_participant_oi_backtest.py
          python -m unittest discover -s tests -p 'test_upstox_market_data.py' -v
          python -m unittest discover -s tests -p 'test_client_ce_pe_provisional_score.py' -v
          python -m unittest discover -s tests -p 'test_client_futures_forward_validation.py' -v
      - name: Run PDMP scan
        env:
          # Manual dispatch और तय चार schedule स्लॉट पर Trends चलेगा।
          # सामान्य 30-मिनट schedule और code push पर Trends कॉल नहीं होंगे।
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          UPSTOX_INSTRUMENT_KEYS: ${{ secrets.UPSTOX_INSTRUMENT_KEYS }}
          TRENDS_SCAN: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'consolidated validation')) || (github.event_name == 'schedule' && (github.event.schedule == '45 3 * * *' || github.event.schedule == '30 5 * * *' || github.event.schedule == '30 7 * * *' || github.event.schedule == '30 13 * * *')) }}
          TRENDS_SLOT: ${{ github.event.schedule == '45 3 * * *' && '0915' || github.event.schedule == '30 5 * * *' && '1100' || github.event.schedule == '30 7 * * *' && '1300' || github.event.schedule == '30 13 * * *' && '1900' || '' }}
        if: github.event_name != 'pull_request'
        run: python fetch_and_score.py
      - name: Run participant OI backtest diagnostics
        if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '15 15 * * *'))
        run: |
          python backtest_participant_oi.py
          python summarize_participant_oi_backtest.py
      - name: Commit results
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "pdmp-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json history.csv participant_oi_history.json participant_oi_backtest.json participant_oi_backtest_summary.json market_signal_history.json crowd_mood_history.json contrarian.json crowd_events.json divergence_events.json signal_state.json signal_log.json mcx_silver.json mcx_gold.json mcx_crudeoil.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "कोई बदलाव नहीं, commit छोड़ा गया"
          else
            git commit -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
