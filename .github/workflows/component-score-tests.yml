name: Component Score Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - "fetch_and_score.py"
      - "dashboard.html"
      - "component_scoring.py"
      - "tests/**"
      - ".github/workflows/component-score-tests.yml"

permissions:
  contents: read

jobs:
  component-score-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install existing scan dependencies
        run: python -m pip install yfinance feedparser requests pytrends
      - name: Python syntax validation
        run: python -m py_compile fetch_and_score.py backtest_participant_oi.py component_scoring.py tests/test_component_scoring.py
      - name: Component unit and current-data fixture tests
        run: python -m unittest discover -s tests -v
      - name: Extract dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("dashboard.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/pdmp-dashboard-inline.js").write_text("\n\n".join(scripts), encoding="utf-8")
          PY
      - name: Dashboard JavaScript syntax validation
        run: node --check /tmp/pdmp-dashboard-inline.js