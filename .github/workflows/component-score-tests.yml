name: Component Score Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - "fetch_and_score.py"
      - "dashboard.html"
      - "market-activity.js"
      - "component_scoring.py"
      - "provisional_component_scoring.py"
      - "archive_component_diagnostics.py"
      - "nse_option_buildup.py"
      - "nse_index_option_oi_archive.py"
      - "nse_index_option_oi.json"
      - "mcx_bhavcopy_archive.json"
      - "tests/**"
      - ".github/workflows/component-score-tests.yml"

permissions:
  contents: read

jobs:
  component-score-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install scan dependencies
        run: python -m pip install yfinance feedparser requests pytrends curl_cffi
      - name: Python syntax validation
        run: python -m py_compile fetch_and_score.py component_scoring.py provisional_component_scoring.py archive_component_diagnostics.py nse_option_buildup.py nse_index_option_oi_archive.py tests/*.py
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Build offline NSE and MCX archive diagnostics (no provider requests)
        run: python archive_component_diagnostics.py
      - name: Upload archive component diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-component-diagnostics
          path: archive-component-diagnostics.json
          if-no-files-found: error
          retention-days: 14
      - name: Extract dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("dashboard.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline dashboard script found")
          Path("/tmp/pdmp-dashboard-inline.js").write_text("\n\n".join(scripts), encoding="utf-8")
          PY
      - name: Dashboard JavaScript syntax validation
        run: node --check /tmp/pdmp-dashboard-inline.js
      - name: Market Activity JavaScript syntax validation
        run: node --check market-activity.js
