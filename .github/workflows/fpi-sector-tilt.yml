name: Refresh FPI fortnightly sector tilt
on:
  workflow_dispatch:
  schedule:
    # NSDL releases fortnightly reports after period-end.
    - cron: "25 2 8,23 * *"
permissions:
  contents: write
concurrency:
  group: fpi-sector-tilt-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and validate six NSDL equity fortnights
        run: python fpi_sector_tilt.py
      - name: Commit only the independent FPI reference file
        run: |
          if [ -z "$(git status --porcelain -- fpi-sector-data.json)" ]; then
            echo "No FPI sector data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fpi-sector-data.json
          git commit -m "Refresh NSDL FPI fortnightly sector flows"
          git pull --rebase origin main
          git push origin HEAD:main
