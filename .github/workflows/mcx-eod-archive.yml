name: MCX EOD Bhavcopy Archive

on:
  schedule:
    # One official Bhavcopy request after MCX EOD publication (22:45 IST).
    - cron: "15 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcx-eod-bhavcopy-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install scanner runtime dependencies
        run: python -m pip install yfinance feedparser requests curl_cffi pytrends
      - name: Validate archive code and run offline tests
        run: |
          python -m py_compile mcx_bhavcopy_archive.py
          python -m unittest discover -s tests -p 'test_mcx_bhavcopy_archive.py' -v
      - name: Fetch one dated official MCX Bhavcopy
        run: python mcx_bhavcopy_archive.py
      - name: Commit new EOD session only when archive changed
        run: |
          # Stage first: a first-run archive is untracked, so git diff alone misses it.
          git add -f -- mcx_bhavcopy_archive.json
          if git diff --cached --quiet -- mcx_bhavcopy_archive.json; then
            echo "MCX_ARCHIVE_NO_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive official MCX GOLD/SILVER EOD Bhavcopy"
          git push
