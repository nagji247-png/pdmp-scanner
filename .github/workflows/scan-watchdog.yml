name: PDMP Scan Watchdog

on:
  # IST market-hours recovery checks: every 5 minutes from 08:30 to 16:55,
  # Monday-Friday. UTC is 5 hours 30 minutes behind IST.
  # Outside market hours, check every 30 minutes; night-time delay is acceptable.
  schedule:
    # Continuous 5-minute watchdog coverage across the full Indian market session
    # 08:30–16:55 IST (03:00–11:25 UTC), every 5 minutes.
    - cron: "*/5 3-10 * * 1-5"
    - cron: "0,5,10,15,20,25 11 * * 1-5"
    # Outside the market session, check every 30 minutes.
    - cron: "3,33 11-23,0-2 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

# Avoid overlapping watchdog checks; the PDMP Scan workflow has its own
# separate concurrency group to prevent simultaneous data-writing scans.
concurrency:
  group: pdmp-scan-watchdog
  cancel-in-progress: false

jobs:
  recover-stale-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out watchdog reader
        uses: actions/checkout@v5
      - name: Dispatch one recovery scan only when needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = "https://api.github.com"

          def api(path, method="GET", payload=None):
              body = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(
                  api_root + path,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "pdmp-scan-watchdog",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read()
                  return json.loads(raw.decode("utf-8")) if raw else {}

          try:
              # Read and validate the complete public data.json; reader retries transient failures.
              from watchdog_data_reader import read_json_object

              source_url = f"https://raw.githubusercontent.com/{repo}/main/data.json"
              data, byte_count = read_json_object(source_url)
              print(f"Read data.json successfully: {byte_count} bytes.")

              # Recover a missed Google Trends slot even when the ordinary
              # PDMP data snapshot is still fresh. The 5-minute watchdog is
              # the fallback if GitHub drops/delays the primary cron event.
              ist = dt.timezone(dt.timedelta(hours=5, minutes=30))
              now_ist = dt.datetime.now(dt.timezone.utc).astimezone(ist)
              slot_times = {
                  "0915": dt.time(9, 15),
                  "1100": dt.time(11, 0),
                  "1300": dt.time(13, 0),
                  "1900": dt.time(19, 0),
              }
              trends = data.get("trends") if isinstance(data.get("trends"), dict) else {}
              daily_slots = trends.get("daily_slots") if isinstance(trends.get("daily_slots"), dict) else {}
              slot_records = daily_slots.get("slots") if daily_slots.get("date") == now_ist.date().isoformat() else {}
              for slot_id, slot_time in slot_times.items():
                  scheduled = dt.datetime.combine(now_ist.date(), slot_time, tzinfo=ist)
                  minutes_late = (now_ist - scheduled).total_seconds() / 60
                  record = slot_records.get(slot_id) if isinstance(slot_records, dict) else None
                  if not (0 <= minutes_late <= 45) or isinstance(record, dict):
                      continue

                  scan_workflow = api(f"/repos/{repo}/actions/workflows/scan.yml")
                  scan_workflow_id = scan_workflow.get("id")
                  if not scan_workflow_id:
                      raise RuntimeError("PDMP Scan workflow ID could not be resolved for Trends recovery")
                  runs = api(f"/repos/{repo}/actions/workflows/{scan_workflow_id}/runs?per_page=20")
                  active = [
                      run for run in runs.get("workflow_runs", [])
                      if run.get("status") in ("queued", "in_progress", "waiting", "requested", "pending")
                  ]
                  if active:
                      print("A PDMP Scan is already queued or running; Trends slot recovery deferred.")
                      raise SystemExit(0)

                  api(f"/repos/{repo}/dispatches", method="POST", payload={
                      "event_type": "trends-slot-recovery",
                      "client_payload": {
                          "trends_slot": slot_id,
                          "reason": f"scheduled Google Trends slot {slot_id} missing from today's published data",
                      },
                  })
                  print(f"Missed Google Trends slot {slot_id} recovered by watchdog.")
                  raise SystemExit(0)

              updated = data.get("updated")
              if not updated:
                  age_minutes = 10**9
              else:
                  stamp = dt.datetime.fromisoformat(str(updated).replace("Z", "+00:00"))
                  if stamp.tzinfo is None:
                      stamp = stamp.replace(tzinfo=dt.timezone.utc)
                  age_minutes = (
                      dt.datetime.now(dt.timezone.utc) - stamp.astimezone(dt.timezone.utc)
                  ).total_seconds() / 60

              if age_minutes < 0:
                  print("Published data timestamp is in the future; recovery scan skipped.")
                  raise SystemExit(0)
              if age_minutes <= 35:
                  print(f"Published data is fresh ({age_minutes:.1f} minutes old); no scan needed.")
                  raise SystemExit(0)

              # Resolve the PDMP Scan workflow by its stable file path. The
              # numeric workflow ID can change if GitHub recreates the workflow.
              scan_workflow = api(f"/repos/{repo}/actions/workflows/scan.yml")
              scan_workflow_id = scan_workflow.get("id")
              if not scan_workflow_id:
                  raise RuntimeError("PDMP Scan workflow ID could not be resolved")
              runs = api(f"/repos/{repo}/actions/workflows/{scan_workflow_id}/runs?per_page=20")
              active = [
                  run for run in runs.get("workflow_runs", [])
                  if run.get("status") in ("queued", "in_progress", "waiting", "requested", "pending")
              ]
              if active:
                  print("A PDMP Scan is already queued or running; duplicate dispatch skipped.")
                  raise SystemExit(0)

              api(f"/repos/{repo}/dispatches", method="POST", payload={
                  "event_type": "scan-watchdog",
                  "client_payload": {"reason": "published data older than 35 minutes; preempt 45-minute dashboard NO TRADE guard"},
              })
              print(f"Recovery scan dispatched; published data was {age_minutes:.1f} minutes old.")
          except SystemExit:
              raise
          except Exception as exc:
              print(f"Watchdog check failed safely: {type(exc).__name__}: {str(exc)[:180]}")
              raise
          PY
