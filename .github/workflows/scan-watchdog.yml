name: PDMP Scan Watchdog

on:
  # Schedule registration refresh: check every 10 minutes; dispatch only if published scan data is stale.
  # This keeps recovery ahead of the dashboard's 45-minute NO TRADE cutoff.
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  recover-stale-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one recovery scan only when needed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64
          import datetime as dt
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api_root = "https://api.github.com"

          def api(path, method="GET", payload=None):
              body = json.dumps(payload).encode("utf-8") if payload is not None else None
              request = urllib.request.Request(
                  api_root + path,
                  data=body,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + token,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "pdmp-scan-watchdog",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read()
                  return json.loads(raw.decode("utf-8")) if raw else {}

          try:
              file_data = api(f"/repos/{repo}/contents/data.json?ref=main")
              decoded = base64.b64decode(file_data["content"]).decode("utf-8")
              data = json.loads(decoded)
              updated = data.get("updated")
              if not updated:
                  age_minutes = 10**9
              else:
                  stamp = dt.datetime.fromisoformat(str(updated).replace("Z", "+00:00"))
                  if stamp.tzinfo is None:
                      stamp = stamp.replace(tzinfo=dt.timezone.utc)
                  age_minutes = (
                      dt.datetime.now(dt.timezone.utc) - stamp.astimezone(dt.timezone.utc)
                  ).total_seconds() / 60

              if age_minutes < 0:
                  print("Published data timestamp is in the future; recovery scan skipped.")
                  raise SystemExit(0)
              if age_minutes <= 35:
                  print(f"Published data is fresh ({age_minutes:.1f} minutes old); no scan needed.")
                  raise SystemExit(0)

              # Resolve the PDMP Scan workflow by its stable file path. The
              # numeric workflow ID can change if GitHub recreates the workflow.
              scan_workflow = api(f"/repos/{repo}/actions/workflows/scan.yml")
              scan_workflow_id = scan_workflow.get("id")
              if not scan_workflow_id:
                  raise RuntimeError("PDMP Scan workflow ID could not be resolved")
              runs = api(f"/repos/{repo}/actions/workflows/{scan_workflow_id}/runs?per_page=20")
              active = [
                  run for run in runs.get("workflow_runs", [])
                  if run.get("status") in ("queued", "in_progress", "waiting", "requested", "pending")
              ]
              if active:
                  print("A PDMP Scan is already queued or running; duplicate dispatch skipped.")
                  raise SystemExit(0)

              api(f"/repos/{repo}/dispatches", method="POST", payload={
                  "event_type": "scan-watchdog",
                  "client_payload": {"reason": "published data older than 35 minutes"},
              })
              print(f"Recovery scan dispatched; published data was {age_minutes:.1f} minutes old.")
          except SystemExit:
              raise
          except Exception as exc:
              print(f"Watchdog check failed safely: {type(exc).__name__}: {str(exc)[:180]}")
              raise
          PY
