name: Build TRINETRA company data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1-5"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free data libraries
        run: python -m pip install requests yfinance
      - name: Build company universe
        run: python trinetra_data.py
      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- trinetra-data.json)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trinetra-data.json
          git commit -m "Refresh TRINETRA company data"
          git push
