name: NSE NIFTY Option Premium Snapshots

on:
  pull_request:
    paths:
      - "nse_option_premium_snapshots.py"
      - "tests/test_nse_option_premium_snapshots.py"
      - ".github/workflows/nse-option-premium-snapshots.yml"
  workflow_dispatch:
  schedule:
    # 09:15 IST opening snapshot, then every 10 minutes through 15:30 IST.
    - cron: "45 3 * * 1-5"
    - cron: "*/10 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nse-nifty-option-premium-snapshots
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the single HTTP dependency
        run: python -m pip install requests
      - name: Validate snapshot parser
        run: python -m unittest discover -s tests -p "test_nse_option_premium_snapshots.py" -v
      - name: Fetch one NSE snapshot
        if: github.event_name != 'pull_request'
        run: python nse_option_premium_snapshots.py
      - name: Commit verified snapshot only
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "pdmp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add nse_option_premium_snapshots.json
          if git diff --cached --quiet; then
            echo "No new NSE timestamp; no commit needed."
            exit 0
          fi
          git commit -m "capture NSE NIFTY option premium snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
