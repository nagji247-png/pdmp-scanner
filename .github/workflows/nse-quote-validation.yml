name: Validate NSE and MCX quote integration

on:
  pull_request:
    paths:
      - "fetch_and_score.py"
      - "trinetra_data.py"
      - ".github/workflows/nse-quote-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install yfinance feedparser requests pytrends curl_cffi
      - name: Check Python syntax
        run: python -m py_compile fetch_and_score.py trinetra_data.py
      - name: Verify Google Trends fallbacks and NSE MCP handshake
        run: |
          python - <<'PY'
          import json
          import sys
          import types
          from unittest.mock import patch
          import fetch_and_score as app

          # The third source must be attempted only after both hourly requests fail.
          sys.modules["pytrends"] = types.ModuleType("pytrends")
          related = {
              "ok": True, "crowd_bull_pct": 61.0,
              "bull_score_pct": 35.0, "bear_score_pct": 25.0,
              "neutral_score_pct": 40.0, "source_data_time": "2026-11-04T10:00:00+00:00",
              "crowd_terms": [], "today_bull_pct": 61.0,
          }
          with patch.object(app, "_trends_once", side_effect=[ValueError("hourly 1d"), ValueError("hourly 7d")]) as hourly:
              with patch.object(app, "_trends_related_queries", return_value=related) as related_queries:
                  result = app.fetch_trends()
                  assert result["ok"] is True, result
                  assert result["fallback_source"] == "Google Trends related_queries", result
                  assert result["today_basis"] == "now_1d_related_queries", result
                  assert hourly.call_count == 2
                  related_queries.assert_called_once_with(timeframe="now 1-d")
          print("Google Trends related-query fallback routing passed.")

          # Exercise initialize -> fire-and-forget initialized notification -> tools/call.
          class FakeResponse:
              def __init__(self, status_code, payload=None, headers=None):
                  self.status_code = status_code
                  self._payload = payload or {}
                  self.headers = headers or {"content-type": "application/json"}
                  self.text = json.dumps(self._payload) if payload is not None else ""
              def json(self):
                  return self._payload

          class FakeSession:
              def __init__(self):
                  self.calls = []
              def post(self, url, headers, json, timeout):
                  self.calls.append((url, headers, json, timeout))
                  method = json.get("method")
                  if method == "initialize":
                      return FakeResponse(200, {"jsonrpc": "2.0", "id": 1, "result": {}},
                                          {"content-type": "application/json", "mcp-session-id": "test-session"})
                  if method == "notifications/initialized":
                      # The live NSE server may return HTTP 404 here; client must continue.
                      return FakeResponse(404)
                  if method == "tools/call":
                      return FakeResponse(200, {
                          "jsonrpc": "2.0", "id": 1,
                          "result": {"content": [{"type": "text", "text": '{"ok":true}'}]}
                      })
                  raise AssertionError(f"Unexpected MCP method: {method}")

          fake_session = FakeSession()
          with patch.object(app, "NSE_MCP_HTTP", fake_session):
              with patch.object(app, "NSE_MCP_WARMED", True):
                  with patch.object(app, "NSE_MCP_SESSION_ID", None):
                      payload = app.nse_mcp_call("cm_get_index_quote", {"indexName": "NIFTY 50"})
          assert payload == {"ok": True}, payload
          assert [call[2]["method"] for call in fake_session.calls] == [
              "initialize", "notifications/initialized", "tools/call"
          ]
          assert fake_session.calls[-1][1]["Mcp-Session-Id"] == "test-session"
          assert fake_session.calls[-1][2]["params"]["arguments"] == {"indexName": "NIFTY 50"}
          print("NSE Streamable HTTP session and tool-call checks passed.")
          PY
      - name: Verify NSE timestamp formatter
        run: |
          python - <<'PY'
          import fetch_and_score as app
          date, clock = app.nse_stamp_fields("02-Nov-2026 15:30:00")
          assert date == "02/11/2026", (date, clock)
          assert clock == "03:30 PM IST", (date, clock)
          date, clock = app.nse_stamp_fields("2026-11-02 16:00:27")
          assert date == "02/11/2026", (date, clock)
          assert clock == "04:00 PM IST", (date, clock)
          print("Timestamp formatting checks passed.")
          PY
      - name: Verify MCX source price, daily change, and freshness parsing
        run: |
          python - <<'PY'
          import datetime as dt
          import fetch_and_score as app

          ist = dt.timezone(dt.timedelta(hours=5, minutes=30))
          now = dt.datetime.now(dt.timezone.utc).astimezone(ist)
          stamp = now.strftime("%d %b, %Y | %H:%M IST")

          gold_html = (
              "<div>₹1,42,405.00</div>"
              f"<div>+₹2,953.00 (2.12%) Last updated on {stamp} "
              "Prev. Close₹1,39,452.00</div>"
          )
          gold = app.parse_upstox_mcx_quote(gold_html, 50000, 500000, "MCX GOLD")
          assert gold["price"] == 142405.0, gold
          assert gold["previous_close"] == 139452.0, gold
          assert gold["change_pct"] == 2.12, gold

          silver_html = (
              "<div>₹1,86,802.00</div>"
              f"<div>+₹7,104.00 (3.95%) Last updated on {stamp} "
              "Prev. Close₹1,79,698.00</div>"
          )
          silver = app.parse_upstox_mcx_quote(silver_html, 50000, 500000, "MCX SILVER")
          assert silver["price"] == 186802.0, silver
          assert silver["previous_close"] == 179698.0, silver
          assert silver["change_pct"] == 3.95, silver
          assert app.mcx_reference_is_fresh({"source_time": gold["source_time"]})

          during_session = dt.datetime(2026, 11, 5, 12, 0, tzinfo=ist)
          stale = during_session - dt.timedelta(minutes=46)
          stale_data = {"source_time": stale.strftime("%Y-%m-%d %H:%M IST")}
          assert not app.mcx_reference_is_fresh(stale_data, now=during_session), stale_data

          after_close = dt.datetime(2026, 11, 4, 23, 40, tzinfo=ist)
          last_close = {"source_time": "2026-11-04 23:29 IST"}
          assert app.mcx_reference_is_fresh(last_close, now=after_close)
          assert not app.mcx_reference_is_live(last_close, now=after_close)

          # Historical rows, not Open or a misleading quote-header PreviousClose,
          # define the previous session close for the same expiry.
          history_html = """
          <div>₹1,87,580.00</div>
          <div>Expiry: 4 December, 26</div>
          <div>Last updated on 04 Nov, 2026 | 23:55 IST</div>
          <table>
            <tr><th>Date</th><th>Expiry</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Day Change</th></tr>
            <tr><td>4 Nov, 26</td><td>04 Dec, 26</td><td>179888</td><td>188000</td><td>177600</td><td>187580</td><td>+7882 (4.39%)</td></tr>
            <tr><td>3 Nov, 26</td><td>04 Dec, 26</td><td>179420</td><td>180100</td><td>178900</td><td>179698</td><td>-100 ( -0.06%)</td></tr>
          </table>
          """
          corrected = app.parse_upstox_mcx_quote(history_html, 50000, 500000, "MCX SILVER", require_fresh=False)
          assert corrected["previous_close"] == 179698.0, corrected
          assert corrected["change_pct"] == 4.39, corrected
          assert corrected["previous_close_date"] == "2026-11-03", corrected

          gold_history = history_html.replace("₹1,87,580.00", "₹1,43,293.00").replace(
              "Expiry: 4 December, 26", "Expiry: 4 December, 26"
          ).replace("179888", "139408").replace("188000", "143420").replace(
              "177600", "139177").replace("187580", "143293").replace(
              "+7882 (4.39%)", "+3841 (2.75%)").replace(
              "179420", "139420").replace("180100", "140415").replace(
              "178900", "137863").replace("179698", "139452")
          corrected_gold = app.parse_upstox_mcx_quote(gold_history, 50000, 500000, "MCX GOLD", require_fresh=False)
          assert corrected_gold["previous_close"] == 139452.0, corrected_gold
          assert corrected_gold["change_pct"] == 2.75, corrected_gold

          crude_history = history_html.replace("₹1,87,580.00", "₹8,381.00").replace(
              "Expiry: 4 December, 26", "Expiry: 19 November, 26"
          ).replace("04 Dec, 26", "19 Nov, 26").replace("179888", "9078").replace(
              "188000", "9189").replace("177600", "8231").replace("187580", "8381").replace(
              "+7882 (4.39%)", "-723 (-7.94%)").replace("179420", "9120").replace(
              "180100", "9372").replace("178900", "8873").replace("179698", "9104")
          corrected_crude = app.parse_upstox_mcx_quote(crude_history, 3000, 30000, "MCX CRUDEOIL", require_fresh=False)
          assert corrected_crude["previous_close"] == 9104.0, corrected_crude
          assert corrected_crude["change_pct"] == -7.94, corrected_crude
          print("Same-contract historical previous-close checks passed for SILVER +4.39%, GOLD +2.75%, CRUDEOIL -7.94%.")

          print("MCX quote parsing, freshness and live/closed labels passed.")
          PY
      - name: Verify symbol-specific NSE quote validation
        run: |
          python - <<'PY'
          import datetime as dt
          import fetch_and_score as app

          ist = dt.timezone(dt.timedelta(hours=5, minutes=30))
          before_open = dt.datetime(2026, 11, 5, 7, 34, tzinfo=ist)
          payload = {
              "equityResponse": [{
                  "metaData": {
                      "symbol": "SBIN",
                      "lastUpdateTime": "04-Nov-2026 16:00:27",
                      "previousClose": 970.25,
                      "pChange": 0.90,
                  },
                  "tradeInfo": {"lastPrice": 979.00},
              }]
          }
          quote = app.parse_nse_direct_equity_payload("SBIN", payload, now=before_open)
          assert quote and quote["price"] == 979.00, quote
          assert quote["change_pct"] == 0.90, quote
          assert quote["source"].endswith("पिछला बंद भाव"), quote

          wrong_symbol = {
              "equityResponse": [{
                  "metaData": {"symbol": "OTHER", "lastUpdateTime": "04-Nov-2026 16:00:27"},
                  "tradeInfo": {"lastPrice": 258.00},
              }]
          }
          assert app.parse_nse_direct_equity_payload("SBIN", wrong_symbol, now=before_open) is None

          during_session = dt.datetime(2026, 11, 5, 10, 0, tzinfo=ist)
          stale = {
              "equityResponse": [{
                  "metaData": {"symbol": "SBIN", "lastUpdateTime": "05-Nov-2026 09:00:00"},
                  "tradeInfo": {"lastPrice": 979.00},
              }]
          }
          assert app.parse_nse_direct_equity_payload("SBIN", stale, now=during_session) is None

          from unittest.mock import patch
          fallback = {"price": 22714.0, "stamp": "04-Nov-2026 15:30:00", "source": "Google Finance previous close"}
          with patch.object(app, "nse_web_indices_quote", return_value=None):
              with patch.object(app, "google_finance_quote", return_value=fallback) as google:
                  index_quote = app.nse_cash_quote("NIFTY", "^NSEI")
          assert index_quote == fallback, index_quote
          google.assert_called_once_with("NIFTY_50", "INDEXNSE", "NIFTY 50")
          print("NSE symbol identity, timestamp, index fallback and stale-quote guards passed.")
          PY
      - name: Verify official MCX Market Watch FUTCOM parsing
        run: |
          python - <<'PY'
          import datetime as dt
          import fetch_and_score as app

          ist = dt.timezone(dt.timedelta(hours=5, minutes=30))
          before_open = dt.datetime(2026, 11, 5, 7, 34, tzinfo=ist)
          rows = [
              {
                  "Symbol": "GOLD", "ExpiryDate": "04DEC2026", "Unit": "10 GRMS",
                  "Open": 143000, "Low": 142900, "LTP": 143293, "High": 143500,
                  "PreviousClose": 139452, "PercentChange": 2.75, "OpenInterest": 15955,
                  "LTTValue": "2026-11-04 23:54:58", "InstrumentName": "FUTCOM",
              },
              {
                  "Symbol": "GOLD", "ExpiryDate": "05NOV2026", "Unit": "10 GRMS",
                  "Open": 142900, "Low": 142800, "LTP": 143000, "High": 143100,
                  "PreviousClose": 139452, "PercentChange": 2.54, "OpenInterest": 900,
                  "LTTValue": "2026-11-04 23:54:58", "InstrumentName": "FUTCOM",
              },
              {
                  "Symbol": "SILVER", "ExpiryDate": "05DEC2026", "Unit": "1 KGS",
                  "Open": 187000, "Low": 186900, "LTP": 187580, "High": 188000,
                  "PreviousClose": 187735, "PercentChange": -0.08, "OpenInterest": 12000,
                  "LTTValue": "2026-11-04 23:55:00", "InstrumentName": "FUTCOM",
              },
              {
                  "Symbol": "CRUDEOIL", "ExpiryDate": "19NOV2026", "Unit": "1 BBL",
                  "Open": 8360, "Low": 8300, "LTP": 8381, "High": 8400,
                  "PreviousClose": 8305, "PercentChange": 0.20, "OpenInterest": 6000,
                  "LTTValue": "2026-11-04 23:54:00", "InstrumentName": "FUTCOM",
              },
              {
                  "Symbol": "GOLD", "ExpiryDate": "04DEC2026", "Unit": "10 GRMS",
                  "LTP": 150250, "OpenInterest": 99999,
                  "LTTValue": "2026-11-04 23:54:58", "InstrumentName": "OPTFUT",
              },
          ]
          quotes = app.parse_mcx_market_watch_rows(rows, now=before_open)
          assert quotes["GOLD"]["price"] == 143293, quotes
          assert quotes["GOLD"]["expiry"] == "2026-12-04", quotes
          assert quotes["GOLD"]["open_interest"] == 15955, quotes
          assert quotes["SILVER"]["price"] == 187580, quotes
          assert quotes["CRUDEOIL"]["price"] == 8381, quotes

          during_session = dt.datetime(2026, 11, 5, 12, 0, tzinfo=ist)
          assert app.parse_mcx_market_watch_rows(rows, now=during_session) == {}
          print("MCX FUTCOM symbol, expiry, OI selection and 45-minute freshness checks passed.")
          PY
      # External NSE endpoints can rate-limit or return 404 from GitHub runners.
      # Keep this diagnostic visible without blocking unrelated code validation.
      - name: Diagnostic NSE index and stock quote probe
        continue-on-error: true
        run: |
          python - <<'PY'
          import fetch_and_score as app
          for name, symbol in (("NIFTY", "^NSEI"), ("SENSEX", "^BSESN"), ("RELIANCE", "RELIANCE.NS"), ("SBIN", "SBIN.NS")):
              quote = app.nse_cash_quote(name, symbol)
              if not quote:
                  print(f"NSE quote unavailable for {name}; external probe only.")
                  continue
              date, clock = app.nse_stamp_fields(quote.get("stamp"))
              print(f"{name}: price={quote.get('price')} date={date} time={clock} source={quote.get('source')}")
          PY

      - name: Diagnostic official MCX Market Watch probe
        continue-on-error: true
        run: |
          python - <<'PY'
          import fetch_and_score as app
          try:
              rows = app.fetch_mcx_market_watch_rows()
              quotes = app.parse_mcx_market_watch_rows(rows)
              print(f"MCX official endpoint: {len(rows)} rows; fresh tracked contracts={sorted(quotes)}")
          except Exception as exc:
              print(f"MCX official endpoint unavailable on this runner; fallback remains enabled: {str(exc)[:220]}")
          PY
