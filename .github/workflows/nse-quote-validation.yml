      # External NSE endpoints can rate-limit or return 404 from GitHub runners.
      # Keep this diagnostic visible without blocking unrelated code validation.
      - name: Diagnostic NSE index and stock quote probe
        continue-on-error: true
        run: |
          python - <<'PY'
          import fetch_and_score as app
          for name, symbol in (("NIFTY", "^NSEI"), ("SENSEX", "^BSESN"), ("RELIANCE", "RELIANCE.NS"), ("SBIN", "SBIN.NS")):
              quote = app.nse_cash_quote(name, symbol)
              if not quote:
                  print(f"NSE quote unavailable for {name}; external probe only.")
                  continue
              date, clock = app.nse_stamp_fields(quote.get("stamp"))
              print(f"{name}: price={quote.get('price')} date={date} time={clock} source={quote.get('source')}")
          PY

      - name: Diagnostic official MCX Market Watch probe
        continue-on-error: true
        run: |
          python - <<'PY'
          import fetch_and_score as app
          try:
              rows = app.fetch_mcx_market_watch_rows()
              quotes = app.parse_mcx_market_watch_rows(rows)
              print(f"MCX official endpoint: {len(rows)} rows; fresh tracked contracts={sorted(quotes)}")
          except Exception as exc:
              print(f"MCX official endpoint unavailable on this runner; fallback remains enabled: {str(exc)[:220]}")
          PY

      # Research-only: verify NSE's historical index-option API with exact
      # contracts discovered from the official option-chain response.
      # This probe never writes scanner data or enables an OI score.
      - name: Diagnostic NSE historical OPTIDX CE/PE archive probe
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import requests

          base = "https://www.nseindia.com"
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/136.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate, br",
              "X-Requested-With": "XMLHttpRequest",
              "Connection": "keep-alive",
          })
          try:
              for page in ("/option-chain", "/report-detail/fo_eq_security"):
                  warm = session.get(base + page, timeout=15)
                  print(f"NSE session warm {page}: HTTP {warm.status_code}")
              # Historical F&O report page is the documented cookie bootstrap for foCPV.
              session.headers.update({
                  "Referer": base + "/report-detail/fo_eq_security",
                  "Accept": "application/json, text/javascript, */*; q=0.01",
                  "Accept-Encoding": "gzip, deflate",
                  "Pragma": "no-cache",
                  "Cache-Control": "no-cache",
                  "Sec-Fetch-Dest": "empty",
                  "Sec-Fetch-Mode": "cors",
                  "Sec-Fetch-Site": "same-origin",
              })
              trade_date = dt.date(2026, 11, 5)
              for symbol in ("NIFTY", "BANKNIFTY"):
                  meta = session.get(
                      base + "/api/option-chain-contract-info",
                      params={"symbol": symbol},
                      timeout=15,
                  )
                  print(
                      f"{symbol} contract-info: HTTP {meta.status_code}; "
                      f"content-type={meta.headers.get('Content-Type')}; "
                      f"bytes={len(meta.content)}"
                  )
                  if meta.status_code != 200:
                      print(meta.text[:240])
                      continue
                  try:
                      meta_payload = meta.json()
                  except ValueError:
                      print("  non-JSON body=" + repr(meta.text[:300]))
                      continue
                  expiries = []
                  for value in meta_payload.get("expiryDates") or []:
                      try:
                          expiry_date = dt.datetime.strptime(value.title(), "%d-%b-%Y").date()
                      except (TypeError, ValueError):
                          continue
                      if expiry_date >= trade_date:
                          expiries.append((expiry_date, value))
                  if not expiries:
                      print(f"{symbol}: no expiry at/after {trade_date} in official contract-info")
                      continue
                  expiry_date, expiry = min(expiries)
                  chain_response = session.get(
                      base + "/api/option-chain-v3",
                      params={"type": "Indices", "symbol": symbol, "expiry": expiry},
                      timeout=20,
                  )
                  print(
                      f"{symbol} {expiry} option-chain-v3: HTTP {chain_response.status_code}; "
                      f"content-type={chain_response.headers.get('Content-Type')}; "
                      f"bytes={len(chain_response.content)}"
                  )
                  if chain_response.status_code != 200:
                      print(chain_response.text[:240])
                      continue
                  try:
                      chain = chain_response.json()
                  except ValueError:
                      print("  non-JSON chain body=" + repr(chain_response.text[:300]))
                      continue
                  records = chain.get("records") or {}
                  rows = records.get("data") or chain.get("filtered", {}).get("data") or []
                  underlying = records.get("underlyingValue")
                  if underlying is None:
                      underlying = next((
                          leg.get("underlyingValue")
                          for row in rows for leg in (row.get("CE"), row.get("PE"))
                          if isinstance(leg, dict) and leg.get("underlyingValue") is not None
                      ), None)
                  if not rows or underlying is None:
                      print(f"{symbol} {expiry}: chain rows/underlying unavailable; keys={sorted(chain)}")
                      continue
                  expiry_api = expiry_date.strftime("%d-%b-%Y").upper()
                  # First query a chain-nearby CE only to obtain the historical
                  # underlying value. The chain's current spot must not be used
                  # to label a past session's ATM strike.
                  probe_row = min(rows, key=lambda row: abs(float(row.get("strikePrice", 0)) - float(underlying)))
                  probe_strike = int(float(probe_row["strikePrice"]))
                  probe_response = session.get(
                      base + "/api/historicalOR/foCPV",
                      params={
                          "from": trade_date.strftime("%d-%m-%Y"),
                          "to": trade_date.strftime("%d-%m-%Y"),
                          "instrumentType": "OPTIDX",
                          "symbol": symbol,
                          "year": str(expiry_date.year),
                          "expiryDate": expiry_api,
                          "optionType": "CE",
                          "strikePrice": str(probe_strike),
                      },
                      timeout=20,
                  )
                  if probe_response.status_code != 200:
                      print(f"{symbol} historical-underlying probe HTTP {probe_response.status_code}")
                      continue
                  probe_payload = probe_response.json()
                  probe_data = probe_payload.get("data") if isinstance(probe_payload, dict) else None
                  if not isinstance(probe_data, list) or not probe_data:
                      print(f"{symbol}: historical-underlying probe returned no rows")
                      continue
                  historical_underlying = probe_data[0].get("FH_UNDERLYING_VALUE")
                  if historical_underlying is None:
                      print(f"{symbol}: historical underlying missing from dated OPTIDX row")
                      continue
                  selected = min(
                      rows,
                      key=lambda row: abs(float(row.get("strikePrice", 0)) - float(historical_underlying)),
                  )
                  strike = int(float(selected["strikePrice"]))
                  print(
                      f"{symbol}: trade_date={trade_date}, expiry={expiry_api}, "
                      f"chain_underlying={underlying}, historical_underlying={historical_underlying}, "
                      f"historical_nearest_strike={strike}, chain_rows={len(rows)}"
                  )
                  for option_type in ("CE", "PE"):
                      if not isinstance(selected.get(option_type), dict):
                          print(f"{symbol} {expiry_api} {strike} {option_type}: absent from official chain strike list")
                          continue
                      response = session.get(
                          base + "/api/historicalOR/foCPV",
                          params={
                              "from": trade_date.strftime("%d-%m-%Y"),
                              "to": trade_date.strftime("%d-%m-%Y"),
                              "instrumentType": "OPTIDX",
                              "symbol": symbol,
                              "year": str(expiry_date.year),
                              "expiryDate": expiry_api,
                              "optionType": option_type,
                              "strikePrice": str(strike),
                          },
                          timeout=20,
                      )
                      print(f"{symbol} {expiry_api} {strike} {option_type} history: HTTP {response.status_code}")
                      if response.status_code != 200:
                          print(response.text[:180])
                          continue
                      payload = response.json()
                      data = payload.get("data") if isinstance(payload, dict) else None
                      if isinstance(data, list) and data:
                          print(f"  rows={len(data)} columns={sorted(data[0])}")
                          print("  sample=" + json.dumps(data[0], default=str)[:1000])
                      else:
                          print(f"  response keys={sorted(payload) if isinstance(payload, dict) else type(payload).__name__}; no rows for exact contract/date")
          except Exception as exc:
              print(f"NSE historical OPTIDX diagnostic unavailable: {type(exc).__name__}: {str(exc)[:240]}")
          PY
      # Research-only: download the official dated NSE F&O UDiFF Bhavcopy
      # and same-date Contract Master, then inspect schema and exact IDs.
      - name: Diagnostic NSE UDiFF Bhavcopy and Contract Master reconciliation
        timeout-minutes: 5
        continue-on-error: true
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import gzip
          import io
          import zipfile
          from decimal import Decimal, InvalidOperation
          import requests
          from component_scoring import aggregate_nse_udiff_index_option_oi

          day = "20261105"
          trade_date = "2026-11-05"
          base = "https://nsearchives.nseindia.com/content/fo/"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0.0.0 Safari/537.36",
              "Accept": "*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nseindia.com/all-reports-derivatives",
          }
          session = requests.Session()
          session.headers.update(headers)

          def fetch(url, label):
              response = session.get(url, timeout=60)
              print(
                  f"{label}: HTTP {response.status_code}; "
                  f"bytes={len(response.content)}; "
                  f"content-type={response.headers.get('Content-Type')}"
              )
              if response.status_code != 200 or not response.content:
                  raise RuntimeError(f"{label} download failed")
              return response.content

          bhav_name = f"BhavCopy_NSE_FO_0_0_0_{day}_F_0000.csv.zip"
