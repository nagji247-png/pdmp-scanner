name: Validate NSE quote integration

on:
  pull_request:
    paths:
      - "fetch_and_score.py"
      - "trinetra_data.py"
      - ".github/workflows/nse-quote-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install yfinance feedparser requests pytrends
      - name: Check Python syntax
        run: python -m py_compile fetch_and_score.py trinetra_data.py
      - name: Verify Google Trends fallbacks and NSE MCP handshake
        run: |
          python - <<'PY'
          import sys
          import types
          from unittest.mock import patch
          import fetch_and_score as app

          # The third source must be attempted only after both hourly requests fail.
          sys.modules["pytrends"] = types.ModuleType("pytrends")
          related = {
              "ok": True, "crowd_bull_pct": 61.0,
              "bull_score_pct": 35.0, "bear_score_pct": 25.0,
              "neutral_score_pct": 40.0, "source_data_time": "2026-11-04T10:00:00+00:00",
              "crowd_terms": [], "today_bull_pct": 61.0,
          }
          with patch.object(app, "_trends_once", side_effect=[ValueError("hourly 1d"), ValueError("hourly 7d")]) as hourly:
              with patch.object(app, "_trends_related_queries", return_value=related) as related_queries:
                  result = app.fetch_trends()
                  assert result["ok"] is True, result
                  assert result["fallback_source"] == "Google Trends related_queries", result
                  assert result["today_basis"] == "now_1d_related_queries", result
                  assert hourly.call_count == 2
                  related_queries.assert_called_once_with(timeframe="now 1-d")
          print("Google Trends related-query fallback routing passed.")

          # A successful MCP request must initialize, announce initialized, then call the tool.
          class FakeResponse:
              def __init__(self, payload=None, headers=None, status=200):
                  self._payload = payload or {}
                  self.headers = headers or {}
                  self.status_code = status
              def raise_for_status(self):
                  if self.status_code >= 400:
                      raise RuntimeError("HTTP status")
              def json(self):
                  return self._payload

          class FakeSession:
              def __init__(self):
                  self.calls = []
              def __enter__(self):
                  return self
              def __exit__(self, *args):
                  return False
              def post(self, url, headers=None, json=None, timeout=None):
                  self.calls.append((url, headers or {}, json or {}))
                  if len(self.calls) == 1:
                      return FakeResponse({"result": {"protocolVersion": "2025-03-26"}},
                                          {"Mcp-Session-Id": "test-session"})
                  if len(self.calls) == 2:
                      return FakeResponse(status=202)
                  return FakeResponse({"result": {"content": [
                      {"type": "text", "text": '{"ok": true}'}
                  ]}})
          fake_session = FakeSession()
          with patch.object(app.requests, "Session", return_value=fake_session):
              payload = app.nse_mcp_call("cm_get_index_quote", {"index": "NIFTY"})
          assert payload == {"ok": True}, payload
          assert [call[2].get("method") for call in fake_session.calls] == [
              "initialize", "notifications/initialized", "tools/call"
          ]
          assert fake_session.calls[1][1]["Mcp-Session-Id"] == "test-session"
          assert fake_session.calls[2][1]["MCP-Protocol-Version"] == "2025-03-26"
          print("NSE Streamable HTTP handshake sequence passed.")
          PY
      - name: Verify NSE timestamp formatter
        run: |
          python - <<'PY'
          import fetch_and_score as app
          date, clock = app.nse_stamp_fields("02-Nov-2026 15:30:00")
          assert date == "02/11/2026", (date, clock)
          assert clock == "03:30 PM IST", (date, clock)
          date, clock = app.nse_stamp_fields("2026-11-02 16:00:27")
          assert date == "02/11/2026", (date, clock)
          assert clock == "04:00 PM IST", (date, clock)
          print("Timestamp formatting checks passed.")
          PY
      - name: Verify MCX source price, daily change, and freshness parsing
        run: |
          python - <<'PY'
          import datetime as dt
          import fetch_and_score as app

          ist = dt.timezone(dt.timedelta(hours=5, minutes=30))
          now = dt.datetime.now(dt.timezone.utc).astimezone(ist)
          stamp = now.strftime("%d %b, %Y | %H:%M IST")

          gold_html = (
              "<div>₹1,42,405.00</div>"
              f"<div>+₹2,953.00 (2.12%) Last updated on {stamp} "
              "Prev. Close₹1,39,452.00</div>"
          )
          gold = app.parse_upstox_mcx_quote(gold_html, 50000, 500000, "MCX GOLD")
          assert gold["price"] == 142405.0, gold
          assert gold["previous_close"] == 139452.0, gold
          assert gold["change_pct"] == 2.12, gold

          silver_html = (
              "<div>₹1,86,802.00</div>"
              f"<div>+₹7,104.00 (3.95%) Last updated on {stamp} "
              "Prev. Close₹1,79,698.00</div>"
          )
          silver = app.parse_upstox_mcx_quote(silver_html, 50000, 500000, "MCX SILVER")
          assert silver["price"] == 186802.0, silver
          assert silver["previous_close"] == 179698.0, silver
          assert silver["change_pct"] == 3.95, silver
          assert app.mcx_reference_is_fresh({"source_time": gold["source_time"]})

          stale = now - dt.timedelta(minutes=46)
          stale_data = {"source_time": stale.strftime("%Y-%m-%d %H:%M IST")}
          assert not app.mcx_reference_is_fresh(stale_data), stale_data
          print("MCX quote parsing and stale-data checks passed.")
          PY
      # External NSE endpoints can rate-limit or return 404 from GitHub runners.
      # Keep this diagnostic visible without blocking unrelated code validation.
      - name: Diagnostic NSE index and stock quote probe
        continue-on-error: true
        run: |
          python - <<'PY'
          import fetch_and_score as app
          for name, symbol in (("NIFTY", "^NSEI"), ("SENSEX", "^BSESN"), ("RELIANCE", "RELIANCE.NS")):
              quote = app.nse_cash_quote(name, symbol)
              if not quote:
                  print(f"NSE quote unavailable for {name}; external probe only.")
                  continue
              date, clock = app.nse_stamp_fields(quote.get("stamp"))
              print(f"{name}: price={quote.get('price')} date={date} time={clock} source={quote.get('source')}")
          PY
