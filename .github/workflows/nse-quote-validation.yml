                  )
                  if not result.get("available"):
                      print(f"{newer_date} vs {older_date}: rejected ({result.get('reason')})")
                      continue
                  print(
                      f"{newer_date} vs {older_date}: "
                      f"close_delta={result['change_in_close']:+g} INR; "
                      f"OI_delta={result['change_in_oi_lots']:+g} lots; "
                      f"regime={result['price_oi_regime']}; "
