      # Research-only: MCX futures OI-weighted price breadth across
      # exact common expiries, with a chronological holdout.
      - name: Diagnostic MCX 30-session futures OI breadth backtest
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        continue-on-error: true
        run: |
          python - <<'PY'
          import datetime as dt
          import statistics
          from decimal import Decimal, InvalidOperation
          import fetch_and_score as app

          end = dt.date(2026, 11, 6)
          candidates = []
          cursor = end
          while len(candidates) < 45:
              if cursor.weekday() < 5:
                  candidates.append(cursor)
              cursor -= dt.timedelta(days=1)
          candidates.sort()

          def dec(value):
              try:
                  result = Decimal(str(value).strip())
                  return result if result.is_finite() else None
              except (InvalidOperation, ValueError, TypeError):
                  return None

          snapshots = {}
          for day in candidates:
              day_text = day.isoformat()
              try:
                  rows = app.fetch_mcx_bhavcopy_rows(day_text)
                  current = {"GOLD": {}, "SILVER": {}}
                  for row in rows:
                      if not isinstance(row, dict):
                          continue
                      if str(row.get("InstrumentName") or "").strip().upper() != "FUTCOM":
                          continue
                      symbol = str(row.get("Symbol") or "").strip().upper()
                      if symbol not in current:
                          continue
                      if str(row.get("OptionType") or "-").strip() not in ("", "-"):
                          continue
                      expiry = str(row.get("ExpiryDate") or "").strip().upper()
                      try:
                          expiry_date = dt.datetime.strptime(expiry, "%d%b%Y").date()
                      except ValueError:
                          continue
                      close = dec(row.get("Close"))
                      oi = dec(row.get("OpenInterest"))
                      volume = dec(row.get("Volume"))
                      if close is None or oi is None or volume is None or close <= 0:
                          continue
                      current[symbol][expiry] = {
                          "expiry_date": expiry_date,
                          "close": close,
                          "oi": oi,
                          "volume": volume,
                      }
                  if any(current[symbol] for symbol in current):
                      snapshots[day] = current
                      print(
                          f"MCX {day_text}: GOLD_contracts={len(current['GOLD'])} "
                          f"SILVER_contracts={len(current['SILVER'])}"
                      )
                  else:
                      print(f"MCX {day_text}: no exact GOLD/SILVER FUTCOM rows")
              except Exception as exc:
                  print(f"MCX {day_text}: skip {type(exc).__name__}: {str(exc)[:160]}")

          ordered = sorted(snapshots)
          print(f"MCX backtest valid sessions={len(ordered)} from={ordered[0] if ordered else None} to={ordered[-1] if ordered else None}")
          if len(ordered) < 25:
              print("MCX backtest skipped: fewer than 25 valid sessions")
              raise SystemExit(0)

          for symbol in ("GOLD", "SILVER"):
              observations = []
              for i in range(1, len(ordered) - 1):
                  previous_day, signal_day, next_day = ordered[i-1], ordered[i], ordered[i+1]
                  previous = snapshots[previous_day][symbol]
                  current = snapshots[signal_day][symbol]
                  following = snapshots[next_day][symbol]
                  common = set(previous) & set(current)
                  bullish = Decimal("0")
                  bearish = Decimal("0")
                  used = 0
                  for expiry in common:
                      before = previous[expiry]
                      now = current[expiry]
                      if before["volume"] <= 0 or now["volume"] <= 0:
                          continue
                      oi_delta = now["oi"] - before["oi"]
                      price_delta = now["close"] - before["close"]
                      if oi_delta == 0 or price_delta == 0:
                          continue
                      weight = abs(oi_delta)
                      if price_delta > 0:
                          bullish += weight
                      else:
                          bearish += weight
                      used += 1
                  total = bullish + bearish
                  if total <= 0:
                      continue
                  # Benchmark with the nearest exact expiry available on both
                  # the signal date and the next date; no expiry substitution.
                  eligible = [expiry for expiry in current if expiry in following]
                  if not eligible:
                      continue
                  front = min(eligible, key=lambda expiry: current[expiry]["expiry_date"])
                  current_close = current[front]["close"]
                  next_close = following[front]["close"]
                  if current_close <= 0 or next_close <= 0:
                      continue
                  score = Decimal("10") * (bullish - bearish) / total
                  next_return = (next_close / current_close - Decimal("1")) * Decimal("100")
                  observations.append((signal_day, score, next_return, len(common), used, front))
              directional = [item for item in observations if item[1] != 0 and item[2] != 0]
              split = max(1, int(len(directional) * 0.70))
              train, holdout = directional[:split], directional[split:]
              def summarize(label, sample):
                  direct_hits = sum((item[1] > 0) == (item[2] > 0) for item in sample)
                  inverse_hits = len(sample) - direct_hits
                  correlation = None
                  if len(sample) >= 3:
                      try:
                          correlation = statistics.correlation(
                              [float(item[1]) for item in sample],
                              [float(item[2]) for item in sample],
                          )
                      except statistics.StatisticsError:
                          correlation = None
                  print(
                      f"{symbol} {label}: n={len(sample)} "
                      f"direct={direct_hits}/{len(sample)} "
                      f"contrarian={inverse_hits}/{len(sample)} pearson={correlation}"
                  )
              print(
                  f"{symbol} MCX OI BREADTH SUMMARY: observations={len(observations)} "
                  f"nonzero_directional={len(directional)} "
                  "fixed_formula_no_parameter_tuning=True; research_only=True; in_final=False"
              )
              summarize("IN_SAMPLE", train)
              summarize("OUT_OF_SAMPLE_HOLDOUT", holdout)
              for item in observations[-5:]:
                  print(
                      f"  {item[0]} score={item[1].quantize(Decimal('0.01')):+} "
                      f"next_return={item[2].quantize(Decimal('0.001')):+}% "
                      f"common_expiries={item[3]} used={item[4]} benchmark_expiry={item[5]}"
                  )
          PY
