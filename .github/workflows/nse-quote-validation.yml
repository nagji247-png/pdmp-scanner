              except Exception as exc:
                  print(f"MCX Bhavcopy diagnostic unavailable for {trade_date}: {type(exc).__name__}: {str(exc)[:240]}")
                  snapshots[trade_date] = None

          # Compare every adjacent available trading session for the same
          # exact expiry; no nearest-contract substitution or score creation.
          for symbol in ("GOLD", "SILVER"):
              print(f"\\n{symbol} {expiry} multi-session same-contract comparison:")
              for newer_date, older_date in zip(dates, dates[1:]):
                  newer_rows = snapshots.get(newer_date)
                  older_rows = snapshots.get(older_date)
