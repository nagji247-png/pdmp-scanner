                          and str(row.get("Symbol") or "").strip().upper() == symbol
                          and str(row.get("ExpiryDate") or "").strip().upper() == expiry
                          and str(row.get("OptionType") or "-").strip() in ("", "-")
                      ]
                      if len(matches) == 1:
                          row = matches[0]
                          print(
