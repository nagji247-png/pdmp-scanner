          import csv
          import datetime as dt
          import io
          import statistics
          import zipfile
          from decimal import Decimal, InvalidOperation
          import requests

          end = dt.date(2026, 11, 6)
          candidates = []
          cursor = end
          while len(candidates) < 70:
              if cursor.weekday() < 5:
                  candidates.append(cursor)
              cursor -= dt.timedelta(days=1)
          candidates.sort()
          base = "https://nsearchives.nseindia.com/content/fo/"
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0.0.0 Safari/537.36",
              "Accept": "*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nseindia.com/all-reports-derivatives",
          })

          def dec(value):
              try:
                  number = Decimal(str(value).strip())
                  return number if number.is_finite() else None
              except (InvalidOperation, ValueError, TypeError):
                  return None

          def fetch_day(day):
              stamp = day.strftime("%Y%m%d")
              url = base + f"BhavCopy_NSE_FO_0_0_0_{stamp}_F_0000.csv.zip"
              response = session.get(url, timeout=45)
              if response.status_code != 200 or not response.content.startswith(b"PK"):
                  print(f"{day}: skip HTTP {response.status_code} bytes={len(response.content)}")
                  return None
              with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
                  names = [name for name in archive.namelist() if name.lower().endswith(".csv")]
                  if len(names) != 1:
                      print(f"{day}: skip unexpected ZIP members={names[:4]}")
                      return None
                  raw = archive.read(names[0]).decode("utf-8-sig")
              rows = list(csv.DictReader(io.StringIO(raw)))
              if not rows:
                  print(f"{day}: skip empty CSV")
                  return None
              return rows

          def build_snapshot(rows, symbol, day):
              contracts = {}
              underlying_values = []
              duplicates = 0
              for row in rows:
                  if str(row.get("FinInstrmTp") or "").strip().upper() != "IDO":
                      continue
                  if str(row.get("TckrSymb") or "").strip().upper() != symbol:
                      continue
                  if str(row.get("BizDt") or "").strip() != day.isoformat():
                      continue
                  underlying = dec(row.get("UndrlygPric"))
                  if underlying is not None and underlying > 0:
                      underlying_values.append(underlying)
                  side = str(row.get("OptnTp") or "").strip().upper()
                  if side not in ("CE", "PE"):
                      continue
                  expiry = str(row.get("XpryDt") or "").strip()
                  strike = str(row.get("StrkPric") or "").strip()
                  oi = dec(row.get("OpnIntrst"))
                  close = dec(row.get("ClsPric"))
                  lot = dec(row.get("NewBrdLotQty"))
                  volume = dec(row.get("TtlTradgVol"))
                  if not expiry or not strike or oi is None or close is None or lot is None or lot <= 0 or volume is None:
                      continue
                  key = (expiry, strike, side)
                  if key in contracts:
                      duplicates += 1
                      continue
                  contracts[key] = {"oi": oi, "close": close, "lot": lot, "volume": volume}
              underlying = None
              if underlying_values:
                  underlying_values.sort()
                  underlying = underlying_values[len(underlying_values) // 2]
              return {"contracts": contracts, "underlying": underlying, "duplicates": duplicates}

          raw_by_day = {}
          for day in candidates:
              try:
                  rows = fetch_day(day)
                  if rows is not None:
                      raw_by_day[day] = rows
                      print(f"{day}: downloaded {len(rows)} rows")
              except Exception as exc:
                  print(f"{day}: skip {type(exc).__name__}: {str(exc)[:160]}")

          if len(raw_by_day) < 40:
              print(f"Backtest skipped: only {len(raw_by_day)} valid dated files; need at least 40")
              raise SystemExit(0)

          ordered_days = sorted(raw_by_day)
          for symbol in ("NIFTY", "BANKNIFTY"):
              snapshots = {
                  day: build_snapshot(raw_by_day[day], symbol, day)
                  for day in ordered_days
              }
              observations = []
              print(f"\n{symbol} candidate OI positioning score vs next-session return")
              for i in range(1, len(ordered_days) - 1):
                  previous_day, signal_day, next_day = ordered_days[i-1], ordered_days[i], ordered_days[i+1]
                  prev = snapshots[previous_day]
                  curr = snapshots[signal_day]
                  nxt = snapshots[next_day]
                  common = set(prev["contracts"]) & set(curr["contracts"])
                  bullish_weight = Decimal("0")
                  bearish_weight = Decimal("0")
                  classified = 0
                  lot_mismatches = 0
                  for key in common:
                      before = prev["contracts"][key]
                      now = curr["contracts"][key]
                      if before["lot"] != now["lot"]:
                          lot_mismatches += 1
                          continue
                      if before["volume"] <= 0 or now["volume"] <= 0 or before["close"] <= 0 or now["close"] <= 0:
                          continue
                      oi_delta_lots = (now["oi"] - before["oi"]) / now["lot"]
                      price_delta = now["close"] - before["close"]
                      if oi_delta_lots == 0 or price_delta == 0:
                          continue
                      side = key[2]
                      weight = abs(oi_delta_lots)
                      if side == "CE":
                          is_bullish = price_delta > 0
                      else:
                          is_bullish = price_delta < 0
                      if is_bullish:
                          bullish_weight += weight
                      else:
                          bearish_weight += weight
                      classified += 1
                  total_weight = bullish_weight + bearish_weight
                  if total_weight <= 0 or curr["underlying"] is None or nxt["underlying"] is None:
                      continue
                  score = Decimal("10") * (bullish_weight - bearish_weight) / total_weight
                  next_return = (nxt["underlying"] / curr["underlying"] - Decimal("1")) * Decimal("100")
                  observations.append((signal_day, score, next_return, len(common), classified, lot_mismatches))
                  print(
                      f"{signal_day}: score={score.quantize(Decimal('0.01')):+} "
                      f"next={next_day} return={next_return.quantize(Decimal('0.001')):+}% "
                      f"common={len(common)} classified={classified} lot_mismatches={lot_mismatches}"
                  )
              directional = [item for item in observations if item[1] != 0 and item[2] != 0]
              direct = sum((item[1] > 0) == (item[2] > 0) for item in directional)
              contrarian = len(directional) - direct
              corr = None
              if len(directional) >= 3:
                  scores = [float(item[1]) for item in directional]
                  returns = [float(item[2]) for item in directional]
                  try:
                      corr = statistics.correlation(scores, returns)
                  except statistics.StatisticsError:
                      corr = None
              split = max(1, int(len(directional) * 0.70))
              train = directional[:split]
              holdout = directional[split:]
              def summarize(label, sample):
                  direct_hits = sum((item[1] > 0) == (item[2] > 0) for item in sample)
                  inverse_hits = len(sample) - direct_hits
                  correlation = None
                  if len(sample) >= 3:
                      try:
                          correlation = statistics.correlation(
                              [float(item[1]) for item in sample],
                              [float(item[2]) for item in sample],
                          )
                      except statistics.StatisticsError:
                          correlation = None
                  print(
                      f"{symbol} {label}: n={len(sample)} "
                      f"direct={direct_hits}/{len(sample)} "
                      f"contrarian={inverse_hits}/{len(sample)} "
                      f"pearson={correlation}"
                  )
              print(
                  f"{symbol} BACKTEST SUMMARY: downloaded_sessions={len(ordered_days)} "
                  f"observations={len(observations)} nonzero_directional={len(directional)} "
                  "split=chronological_70pct_train_30pct_holdout; "
                  "fixed_formula_no_parameter_tuning=True; research_only=True; in_final=False"
              )
              summarize("IN_SAMPLE", train)
              summarize("OUT_OF_SAMPLE_HOLDOUT", holdout)
          PY
