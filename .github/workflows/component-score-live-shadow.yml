name: Live Component Score Shadow Scan

on:
  push:
    branches:
      - feature/component-score-breakdown-20261105
    paths:
      - "fetch_and_score.py"
      - "component_scoring.py"
      - ".github/workflows/component-score-live-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-score-live-shadow
  cancel-in-progress: false

jobs:
  shadow-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: feature/component-score-breakdown-20261105
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install scanner dependencies
        run: python -m pip install yfinance feedparser requests pytrends curl_cffi
      - name: Run full scanner with asset-specific Trends enabled
        env:
          TRENDS_SCAN: "false"
          COMPONENT_SHADOW_SCAN: "true"
        run: python fetch_and_score.py
      - name: Validate component breakdown output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("data.json").read_text(encoding="utf-8"))
          instruments = data.get("instruments") or {}
          names = ("NIFTY", "SENSEX", "BANKNIFTY", "GOLD", "SILVER")
          print("SCAN_UPDATED:", data.get("updated"))
          print("COMPONENT_MODE:", data.get("component_score_method"))
          failures = []
          for name in names:
              item = instruments.get(name) or {}
              breakdown = item.get("component_breakdown") or {}
              final = breakdown.get("final") or {}
              print("\\nASSET:", name)
              print("FINAL:", final.get("score"), "INCLUDED:", final.get("included_components"))
              for key, component in (breakdown.get("components") or {}).items():
                  print("COMPONENT:", key, component.get("score"), component.get("source"), component.get("source_date"))
              for key, reason in (breakdown.get("excluded_components") or {}).items():
                  print("EXCLUDED:", key, reason.get("reason"))
              trends = item.get("index_search_shadow") or item.get("asset_search_shadow") or {}
              print("TRENDS:", {k: trends.get(k) for k in ("valid", "seed", "raw_queries", "classified_queries", "unclassified_queries", "classification_coverage_pct", "bull_pct", "bear_pct", "neutral_pct", "reason")})
              print("UNCLASSIFIED_SAMPLE:", trends.get("unclassified_terms", []))
              print("CLASSIFIED_SAMPLE:", trends.get("terms", []))
              print("RISING_DIAGNOSTICS:", {
                  "count": trends.get("rising_queries"),
                  "classified": trends.get("rising_classified_queries"),
                  "directions": trends.get("rising_direction_counts"),
                  "terms": trends.get("rising_terms", []),
              })
              if not breakdown:
                  failures.append(name + ": missing component_breakdown")
              if final.get("score") is not None and not final.get("included_components"):
                  failures.append(name + ": score without included components")
          if failures:
              raise SystemExit("; ".join(failures))
          PY
      - name: Upload shadow scan data (no repository commit)
        if: always() && hashFiles('data.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pdmp-component-shadow-scan
          path: data.json
          if-no-files-found: error
          retention-days: 14
