name: Component Score Live Shadow Scan

on:
  # Manual diagnostic only. The scheduled PDMP Scan already refreshes the
  # five asset-specific Trends seeds and writes their shadow breakdown.
  # Keeping this workflow manual avoids a duplicate five-seed batch at the
  # same 09:15, 11:00, 13:00 and 19:00 IST slots.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-score-live-shadow
  cancel-in-progress: false

jobs:
  live-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install scan dependencies
        run: python -m pip install yfinance feedparser requests pytrends curl_cffi pandas
      - name: Run isolated five-asset component shadow scan
        run: python component_shadow_scan.py
      - name: Upload shadow result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-score-live-shadow
          path: component-score-live-shadow.json
          if-no-files-found: warn
          retention-days: 3
