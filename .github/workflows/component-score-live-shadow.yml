name: Component Score Live Shadow Scan

on:
  # One isolated five-asset Trends batch at the existing approved IST slots:
  # 09:15, 11:00, 13:00 and 19:00, weekdays only.
  # UTC cron: 03:45, 05:30, 07:30 and 13:30.
  schedule:
    - cron: "45 3 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-score-live-shadow
  cancel-in-progress: false

jobs:
  live-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install scan dependencies
        run: python -m pip install yfinance feedparser requests pytrends curl_cffi pandas
      - name: Run isolated five-asset component shadow scan
        run: python component_shadow_scan.py
      - name: Upload shadow result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-score-live-shadow
          path: component-score-live-shadow.json
          if-no-files-found: warn
          retention-days: 3
