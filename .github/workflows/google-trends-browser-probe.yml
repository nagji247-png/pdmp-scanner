name: Google Trends Browser CSV Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser probe
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Export one Google Trends asset through website UI
        run: python tools/google_trends_browser_probe.py
      - name: Preserve raw CSV and diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-trends-browser-probe
          path: google-trends-browser-probe/
          if-no-files-found: warn
          retention-days: 7
