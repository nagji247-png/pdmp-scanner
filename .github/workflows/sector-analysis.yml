name: Refresh independent sector analysis
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sector-analysis.yml"
      - "sector_watchlist.py"
      - "sector-analysis.json"
  schedule:
    - cron: "35 3 * * 1-5"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free market data library
        run: python -m pip install yfinance
      - name: Build sector watchlist from fresh daily candles
        run: python sector_watchlist.py
      - name: Commit updated sector data safely
        run: |
          if [ -z "$(git status --porcelain -- sector-analysis.json)" ]; then
            echo "No sector data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sector-analysis.json
          git commit -m "Refresh sector watchlist with validated market data"
          git pull --rebase origin main
          git push origin HEAD:main
